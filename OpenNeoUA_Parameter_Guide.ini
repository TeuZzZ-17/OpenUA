--------------------Level.LDF:

; Level-side settings override broader defaults where explicitly documented.
; This lets a map define its own ambience, SuperItem profile and atmospheric
; presentation without forcing the same setup on every level.

ambient_sound = sounds/ambient/wind.wav               ; High-priority level ambience. If the path identifies a folder instead of a specific file, OpenNeoUA can choose a sound from that folder and loop it. When present in a level file, this overrides the nucleus.ini setting.
profile = stoudson_nuclear                             ; Inside a SuperItem block, references the matching ID in Data/Scripts/Super_Item_Profiles.txt and creates the custom bomb defined by that profile.
atmospheric_fx_profile = Scripts\FX_Profiles\snow.txt ; Optional atmospheric profile loaded by the level. When present, the profile runs its effects in a loop while active. Absent = no atmospheric profile is activated.

--------------------FX_Profile.txt:

; Atmospheric FX profiles are reusable, data-driven visual/audio layers. A
; level points to the profile with atmospheric_fx_profile rather than embedding
; all spawn behavior directly in the LDF.

begin_fx_profile
loop_sound = sounds/ambient/spore.wav          ; Optional sound loop played while the atmospheric profile is active on screen. Empty/absent = no loop sound.
loop_sound_volume = 70                         ; Volume of the atmospheric profile loop sound. <= 0 = muted/disabled. Runtime default: 100.
mesh_3ds = 3DS\Atmosphere\suig_spore.3ds       ; 3DS mesh spawned by this atmospheric profile.
count = 135                                    ; Number of 3DS meshes maintained within the configured player-centered spawn volume. Values above 512 are clamped to 512.
spawn_radius_x = 1950                          ; Random X spawn radius around the player/viewer.
spawn_radius_y = 720                           ; Random Y spawn radius around the player/viewer.
spawn_radius_z = 1950                          ; Random Z spawn radius around the player/viewer.
spawn_offset_x = 0                             ; X offset of the spawn volume relative to the viewer.
spawn_offset_y = 260                           ; Y offset of the spawn volume relative to the viewer.
spawn_offset_z = 0                             ; Z offset of the spawn volume relative to the viewer.
lifetime_min = 5000                            ; Minimum mesh lifetime in milliseconds.
lifetime_max = 9000                            ; Maximum mesh lifetime in milliseconds.
velocity_x = 8                                 ; Base X-axis mesh velocity.
velocity_y = -18                               ; Base Y-axis mesh velocity.
velocity_z = 5                                 ; Base Z-axis mesh velocity.
velocity_random_x = 40                         ; Random X-axis velocity variation.
velocity_random_y = 22                         ; Random Y-axis velocity variation.
velocity_random_z = 40                         ; Random Z-axis velocity variation.
scale_x = 3.2                                  ; X-axis scale of spawned meshes.
scale_y = 3.2                                  ; Y-axis scale of spawned meshes.
scale_z = 3.2                                  ; Z-axis scale of spawned meshes.
spin_x = 0.20                                  ; Continuous X-axis rotation rate/intensity.
spin_y = 0.55                                  ; Continuous Y-axis rotation rate/intensity.
spin_z = 0.25                                  ; Continuous Z-axis rotation rate/intensity.
fade_in = 300                                  ; Mesh fade-in duration in milliseconds.
fade_out = 700                                 ; Mesh fade-out duration in milliseconds.
tint = 170_255_145_165                         ; Mesh tint in R_G_B_A format.
end


--------------------Super_Item_Profiles.txt:

; Custom Stoudson Bomb profiles turn the vanilla SuperItem concept into a
; reusable data-driven system. The level owns placement and basic item fields;
; the referenced profile owns the wave, damage, push, audiovisual feedback,
; optional debuff and additional Chain FX.
;
; This file is read only when an LDF level defines profile = <custom_profile_id>.
; Example level-side item:

begin_item
   profile = stoudson_nuclear
   sec_x = 1
   sec_y = 12
   inactive_bp = 35
   active_bp = 36
   trigger_bp = 37
   type = 1
   countdown = 998000
end

begin_superitem_profile                  ; Starts a custom SuperItem profile.
id = stoudson_nuclear                    ; Unique identifier referenced by profile in the level. It is also used as the bomb name, with _ converted to spaces.

fallout_fx_profile = Scripts\FX_Profiles\radiation.txt ; Atmospheric FX profile activated on the map only after the wave has passed.

wave_vp = 283                            ; Legacy VP used for the expanding wave front; final fallback for wave_3ds/wave_base.
wave_base = BASE/FX/NUCLEAR_WAVE.BASE    ; External BASE family for the wave front, relative to Data; automatically falls back to wave_vp.
wave_3ds = 3DS/FX/nuclear_wave.3ds       ; 3DS model for the wave front, relative to Data; takes priority over wave_base and wave_vp.
wave_scale_x = 1.0                       ; Base X-scale multiplier for the VP/BASE/3DS wave visual. X grows automatically with wave radius. <= 0 or invalid = 1.0.
wave_scale_y = 1.0                       ; Vertical Y scale for the VP/BASE/3DS wave visual. Y does not automatically grow with wave radius. <= 0 or invalid = 1.0.
wave_scale_z = 1.0                       ; Base Z-scale multiplier for the VP/BASE/3DS wave visual. Z grows automatically with wave radius. <= 0 or invalid = 1.0.
wave_tint = 255_255_255_255              ; RGBA tint applied to the wave visual for VP, BASE and 3DS.
wave_start_speed = 0                     ; Initial wave-front speed in world units per second. 0 allows the wave to start from rest.
wave_speed_ramp_time = 10000             ; Linear transition time in milliseconds from wave_start_speed to wave_end_speed. 0 = use the final speed immediately.
wave_end_speed = 2000                    ; Final wave-front speed in world units per second. Must be positive.
wave_push_force = 6                      ; One-shot push intensity 0..10 applied to every unit reached by the wave. Uses the shared push curve: 100 * intensity^2 after push_resistance. Also affects allies and invulnerable units; static GUNs are excluded. The per-target one-shot state is saved.
wave_unit_damage = 50000                 ; Base damage applied to valid enemy units reached by the wave. Passes through the target's shield. 0 = no unit damage.
wave_building_total_destruction = 15%    ; Percentage of intact buildings reached by the wave that are destroyed completely. Remaining buildings are damaged when possible.

push_force = 10                          ; Instantaneous push intensity 0..10 generated at the detonation center. Uses the same shared curve, 100 * intensity^2, after falloff and push_resistance.
push_radius = 2000                       ; XZ radius of the instantaneous detonation push. <= 0 disables push_force.
push_falloff = 1                         ; Detonation-push falloff: 1 reduces intensity with distance; 0 keeps the same intensity throughout push_radius.

fade_in = 500                            ; Fade-in in milliseconds for the VP/BASE/3DS wave visual. 0 or absent = immediate appearance.
fade_out = 1000                          ; Fade-out in milliseconds for the VP/BASE/3DS wave visual when it reaches the map's natural limit. 0 or absent = immediate disappearance.

debuff_allow = 1                         ; Enables the debuff when the wave passes over a unit. Requires debuff_duration > 0. 0 = no debuff.
debuff_.........                         ; The SuperItem wave is compatible with the parameters documented in the Debuff system section.

snd_detonate_sample = sounds/new/detonate.wav ; One-shot sound played at the SuperItem center when detonation begins.
snd_detonate_volume = 800                ; Detonation sound volume.
snd_detonate_pitch = 0                   ; Detonation sound pitch.
snd_detonate_radius = 10000              ; Maximum detonation-sound hearing radius. 0 = legacy attenuation behavior.
pal_detonate_slot = 1                    ; Palette-effect slot activated at detonation. 0 = disabled.
pal_detonate_mag0 = 20                   ; Initial palette intensity for detonation.
pal_detonate_mag1 = 10                   ; Final palette intensity for detonation.
pal_detonate_time = 6000                 ; Detonation palette-effect duration in milliseconds.
pal_detonate_radius = 10000              ; Maximum radius of the detonation palette effect.
shk_detonate_slot = 1                    ; Shake slot activated at detonation. 0 = disabled.
shk_detonate_mag0 = 1                    ; Initial detonation-shake intensity.
shk_detonate_mag1 = 2                    ; Final detonation-shake intensity.
shk_detonate_time = 6000                 ; Detonation-shake duration in milliseconds.
shk_detonate_radius = 10000              ; Maximum radius of the detonation shake.

snd_wave_sample = sounds/new/wave.wav    ; Looping sound attached to the wave front and positioned at the point on the front nearest the listener.
snd_wave_volume = 800                    ; Wave sound volume.
snd_wave_pitch = 0                       ; Wave sound pitch.
snd_wave_radius = 2000                   ; Maximum hearing radius measured from the wave front. 0 = legacy attenuation behavior.
pal_wave_slot = 1                        ; Palette-effect slot activated when the wave front enters the listener radius. 0 = disabled.
pal_wave_mag0 = 10                       ; Initial palette intensity of the wave.
pal_wave_mag1 = 5                        ; Final palette intensity of the wave.
pal_wave_time = 12000                    ; Wave palette-effect duration in milliseconds.
pal_wave_radius = 2000                   ; Distance from the front within which the palette effect may activate. 0 or absent uses 2400 as the front activation threshold while preserving legacy radius behavior for the effect.
shk_wave_slot = 1                        ; Shake slot activated when the wave front enters the listener radius. 0 = disabled.
shk_wave_mag0 = 0.1                      ; Initial wave-shake intensity.
shk_wave_mag1 = 0                        ; Final wave-shake intensity.
shk_wave_time = 12000                    ; Wave-shake duration in milliseconds.
shk_wave_radius = 2000                   ; Distance from the front within which wave shake may activate. 0 or absent uses 2400 as the front activation threshold while preserving legacy behavior.

begin_chain_fx                            ; Additional visual Chain FX executed once when detonation starts.
  trigger = detonate                      ; SuperItems currently support detonate as the Chain FX trigger.
  mode = visual                           ; SuperItems currently support visual as the Chain FX mode.
  offset_x = 0                            ; X offset from the bomb's native center.
  offset_y = 0                            ; Y offset from the bomb's native center.
  offset_z = 0                            ; Z offset from the bomb's native center.
  start_size = 0                          ; Initial Chain FX scale.
  mid_size = 10                           ; Optional intermediate scale. If absent/invalid, direct start_size -> end_size interpolation is used.
  end_size = 20                           ; Final Chain FX scale.
  duration = 6000                         ; Total Chain FX duration in milliseconds. Must be positive.
  fade_in = 500                           ; Visual fade-in in milliseconds. 0 or absent = immediate.
  fade_out = 1000                         ; Visual fade-out in milliseconds. 0 or absent = immediate.
  vp_model = 254                          ; Legacy VP visual for this Chain FX element. The line may be repeated to build a sequence.
  base_model = BASE/FX/CHAIN_FX.BASE      ; Optional BASE family for the same element. Place it after vp_model to keep that VP as fallback.
  3ds_model = 3DS/FX/chain_fx.3ds         ; Optional 3DS model for the same element; takes priority over base_model and vp_model.
  visual_tint = 255_255_255_255           ; RGBA tint associated with the preceding VP/BASE/3DS Chain FX visual.
end

--------------------Buildings:

; Building decoration FX can be periodic or persistent. Both modes use the same
; VP/BASE/3DS visual family, but their lifetime rules differ:
; - periodic: spawn one or more decorations at configured intervals;
; - persistent: keep the decoration active while the building remains active
;   and alive.

decoration_fx_mode = periodic                 ; Periodic decoration mode: decorations appear intermittently using the timing/count parameters below.
decoration_fx_vp = 99                         ; Legacy VP decoration visual; final fallback.
decoration_fx_base = BASE/FX/DECORATION.BASE  ; BASE decoration family, relative to Data; falls back to decoration_fx_vp.
decoration_fx_3ds = 3DS/FX/decoration.3ds     ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_x = 1.0                   ; X scale of the active decoration visual.
decoration_fx_scale_y = 1.0                   ; Y scale of the active decoration visual.
decoration_fx_scale_z = 1.0                   ; Z scale of the active decoration visual.
decoration_fx_spin_x = 0                      ; X spin intensity for the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_y = 0                      ; Y spin intensity for the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_z = 0                      ; Z spin intensity for the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_tint = 255_95_70_200            ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_in = 500                   ; Main VP/3DS decoration fade-in in milliseconds. 0 or absent = immediate appearance.
decoration_fx_fade_out = 500                  ; Main VP/3DS decoration fade-out in milliseconds. 0 or absent = immediate disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255 ; RGBA tint of VP decoration particles/trails. Under additive blending, fading also attenuates visual intensity correctly.
decoration_fx_vp_trail_scale_x = 1.0          ; X scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_y = 1.0          ; Y scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_z = 1.0          ; Multiplier for particle/trail duration and therefore apparent trail length.
decoration_fx_vp_trail_fade_in = 500          ; Time in milliseconds for VP particles/trails to fade from invisible to their configured opacity. 0 or absent = immediate appearance.
decoration_fx_vp_trail_fade_out = 500         ; Time in milliseconds for VP particles/trails to fade to invisible. 0 or absent = immediate disappearance.
decoration_fx_duration = 1000                 ; Total duration in milliseconds of each periodic decoration instance.
decoration_fx_interval = 500_1500             ; Random interval in milliseconds between decoration spawns. A single value gives a fixed interval.
decoration_fx_count = 2_7                     ; Random number of decorations generated per spawn. A single value gives a fixed count.
decoration_fx_random_pos = 90                 ; XYZ position randomization around the center of the building sector.
decoration_fx_offset_x = 0                    ; X offset from the center of the building sector.
decoration_fx_offset_y = 0                    ; Y offset from the center of the building sector.
decoration_fx_offset_z = -40                  ; Z offset from the center of the building sector.

decoration_fx_mode = persistent               ; Persistent decoration mode: the decoration remains active while the building remains active and alive.
decoration_fx_vp = 99                                     ; Legacy VP decoration visual; final fallback.
decoration_fx_base = BASE/FX/DECORATION.BASE              ; BASE decoration family, relative to Data; falls back to decoration_fx_vp.
decoration_fx_3ds = 3DS/FX/decoration.3ds                 ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_x = 1.0                               ; X scale of the active decoration visual.
decoration_fx_scale_y = 1.0                               ; Y scale of the active decoration visual.
decoration_fx_scale_z = 1.0                               ; Z scale of the active decoration visual.
decoration_fx_spin_x = 0                                  ; X spin intensity for the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_y = 0                                  ; Y spin intensity for the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_z = 0                                  ; Z spin intensity for the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_tint = 255_95_70_200                        ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_in = 500                               ; Main VP/3DS decoration fade-in in milliseconds. 0 or absent = immediate appearance.
decoration_fx_fade_out = 500                              ; Main VP/3DS decoration fade-out in milliseconds. 0 or absent = immediate disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255             ; RGBA tint of VP decoration particles/trails. Under additive blending, fading also attenuates visual intensity correctly.
decoration_fx_vp_trail_scale_x = 1.0                      ; X scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_y = 1.0                      ; Y scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_z = 1.0                      ; Multiplier for particle/trail duration and therefore apparent trail length.
decoration_fx_vp_trail_fade_in = 500                      ; Time in milliseconds for VP particles/trails to materialize up to their configured opacity. 0 or absent = immediate appearance.

decoration_fx_vp_trail_fade_out = 500                     ; Time in milliseconds for VP decoration particles/trails to fade out when the decoration ends. 0 or absent = immediate disappearance.
decoration_fx_offset_x = 0                    ; X offset from the center of the building sector.
decoration_fx_offset_y = 0                    ; Y offset from the center of the building sector.
decoration_fx_offset_z = -40                  ; Z offset from the center of the building sector.

; Building spawners let a map object create vehicles dynamically instead of
; requiring every unit to be placed directly in the level data.

spawn_units = 1                               ; Enables this building to spawn units.
spawn_vehicle = 5                             ; Vehicle ID generated by this building.
spawn_count = 3                               ; Number of units generated at each spawner activation.
spawn_interval = 6000                         ; Interval in milliseconds between spawner activations.
spawn_trigger_radius = 1800                   ; XZ radius within which enemy presence activates the spawner.
spawn_random_pos = 340                        ; XZ position randomization around the building center.
spawn_offset_x = 37                           ; X offset applied to the center of the building spawn area.
spawn_offset_z = -41                          ; Z offset applied to the center of the building spawn area.
spawn_height = 650_900                        ; Random additional height above the real surface at which the unit is created. A single value gives a fixed height.
spawn_instant = 1                             ; 1 creates units instantly without the classic Genesis sequence.
spawn_max_active = 9                          ; Maximum number of units generated by this building that may remain active at the same time.

--------------------Vehicles:

; OpenNeoUA adds new vehicle models/aliases and extends existing vehicle
; definitions with AI affinities, per-event speech, custom visuals, collision
; behavior, status systems and other optional capabilities.

model = cruiser                      ; Airborne vehicle model with smooth up/down response and comparatively rigid left/right response.

model = module                       ; Alternate alias for model = gun; behavior is the same.

model = mimic                        ; Mimic vehicle type. Creates a copy of itself using another eligible unit already present on the map as the visual/template source; excludes itself, robo and gun classes. spawn_at_death_units can be combined with this definition for additional behavior.
mimic_tint = 60_255_90_255           ; RGBA multiplier applied to the visual copied by the Mimic, for both VP and 3DS visuals.
mimic_energy_cost = 20000_30000      ; Energy required to create the mimic. Single value = fixed cost; min_max = random cost.
snd_mimic_sample  = sounds/sulgi.wav ; Mimic-specific sound used during disguise.
snd_mimic_volume  = 120
snd_mimic_pitch  	= 5000

; gun_type changes the role of vehicle/building definitions using the gun
; class. This is more than a visual switch: each type selects a different
; interaction path while retaining the existing gun data structure where
; possible.

gun_type = flak                      ; Vanilla flak behavior; no OpenNeoUA role change.
gun_type = mg                        ; Restored cut-content behavior: the flak uses MGUN as its primary weapon. Effective range follows game.mgun_range; tracer rendering uses the shared mgun_mesh_tracer_* family.
gun_type = dummy                     ; Decorative/defensive role: does not interact and its interfaces are disabled.
gun_type = radar                     ; Turns toward the nearest Host Station when that station is visible on radar; otherwise retains the normal gun behavior path.
gun_type = power                     ; Compatible with power and power_radius. The gun does not attack but supplies energy to nearby units.

gun_does_not_fall                    ; gun/flak classes only: prevents the gun from falling even when no supporting surface exists beneath it.

; AI fight affinities extend the original broad flyer/tank targeting families
; to the newer model classes. When omitted, the documented legacy affinity is
; used so older scripts continue to behave as expected.

job_fightplane    = 6                ; AI fight affinity against model = plane. Absent = job_fightflyer.
job_fightglider   = 6                ; AI fight affinity against model = glider. Absent = job_fightflyer.
job_fightzeppelin = 6                ; AI fight affinity against model = zeppelin. Absent = job_fightflyer.
job_fightcruiser  = 6                ; AI fight affinity against model = cruiser. Absent = job_fightflyer.
job_fightufo      = 6                ; AI fight affinity against model = ufo. Absent = job_fightflyer.
job_fightcar      = 6                ; AI fight affinity against model = car. Absent = job_fighttank.
job_fightgun      = 6                ; AI fight affinity against model = gun/module. Absent = legacy AI-path behavior.

spy_ui_radius = 6000                 ; UFO classes only, player side: radius in which unit interfaces are revealed.
zoom_steps    = 4                    ; UFO classes only, player side: maximum number of 1.25x optical zoom-in steps. 0 locks zoom to 1x; absent/invalid keeps the OpenNeoUA limit.

; Vehicle Chain FX can replace the old single-purpose dest_fx relationship with
; an explicit sequence. "visual" creates scalable visuals; "physical" creates a
; real vehicle instance and therefore inherits that vehicle's physical/visual
; properties.

begin_chain_fx                       ; Visual vehicle Chain FX, replacing a dest_fx that points to a scale_fx.
  trigger    = destroyed o crash     ; Trigger: destroyed = vehicle destroyed in the air; crash = vehicle crashes or is destroyed on the ground.
  mode = visual                      ; Visual mode uses start_size/end_size/duration and the VP/BASE/3DS visual definitions below.
  offset_x   = -20                   ; Effect X offset.
  offset_y   = 0                     ; Effect Y offset.
  offset_z   = 20                    ; Effect Z offset.
  start_size = 0.1                   ; Initial effect size. 1 = original visual size.
  end_size   = 2                     ; Final effect size.
  mid_size   = 1                     ; Intermediate effect size.
  duration   = 1000                  ; Effect duration in milliseconds.
  fade_in    = 500                   ; Visual fade-in in milliseconds. 0 or absent = immediate.
  fade_out   = 1000                  ; Visual fade-out in milliseconds. 0 or absent = immediate.
  vp_model   = 229                   ; First legacy VP visual in the sequence.
  base_model = BASE/FX/CHAIN_FX.BASE ; Optional BASE family for the same element. Place after vp_model to keep that VP as fallback.
  3ds_model = 3DS/FX/chain_fx.3ds    ; Optional 3DS model for the same element; takes priority over base_model and vp_model.
  visual_tint = 80_160_255_180       ; RGBA tint associated with the preceding VP/BASE/3DS Chain FX visual.
  vp_model   = 230                   ; Second visual in the sequence.
  visual_tint = 80_160_255_180       ; RGBA tint associated with the preceding visual.
  vp_model   = 231                   ; Third visual in the sequence.
  visual_tint = 80_160_255_180       ; RGBA tint associated with the preceding visual.
end

begin_chain_fx                       ; Physical vehicle Chain FX, replacing a dest_fx without scale_fx.
  trigger    = destroyed o crash     ; Trigger: vehicle destruction or crash.
  mode             = physical        ; Uses physical_vehicle for physical and visual properties.
  offset_x         = -20             ; Physical vehicle X offset.
  offset_y         = 0               ; Physical vehicle Y offset.
  offset_z         = 20              ; Physical vehicle Z offset.
  physical_vehicle = 41              ; Vehicle ID whose physical and visual properties are used by this Chain FX.
end

; Repeatable per-vehicle speech overrides. Each entry points directly to audio
; for one vehicle-specific event. If an entry is missing or cannot be loaded,
; the engine falls back to the vanilla voice selected by vo_type.

speech_event_unit_ready =              sounds/speech/voicepacks/tank-light/unit_ready                  ; Unit ready.
speech_event_unit_idle =               sounds/speech/voicepacks/tank-light/unit_idle                   ; Unit idle.
speech_event_order_ack_friendly =      sounds/speech/voicepacks/tank-light/order_ack_friendly          ; Friendly order acknowledged.
speech_event_order_ack_enemy =         sounds/speech/voicepacks/tank-light/order_ack_enemy             ; Enemy order/command event acknowledged.
speech_event_unit_control_entered =    sounds/speech/voicepacks/tank-light/unit_control_entered        ; Player entered direct unit control.
speech_event_enemy_sector_entered =    sounds/speech/voicepacks/tank-light/enemy_sector_entered        ; Enemy sector entered.
speech_event_unit_recovered =          sounds/speech/voicepacks/tank-light/unit_recovered              ; Unit recovered.
speech_event_enemy_unit_spotted =      sounds/speech/voicepacks/tank-light/enemy_unit_spotted          ; Enemy unit spotted.
speech_event_enemy_host_found =        sounds/speech/voicepacks/tank-light/enemy_host_found            ; Enemy Host Station found.
speech_event_request_support =         sounds/speech/voicepacks/tank-light/request_support             ; Support requested.
speech_event_unit_retreating =         sounds/speech/voicepacks/tank-light/unit_retreating             ; Unit retreating.
speech_event_unit_lost =               sounds/speech/voicepacks/tank-light/unit_lost                   ; Unit lost.
speech_event_enemy_unit_engaged =      sounds/speech/voicepacks/tank-light/enemy_unit_engaged          ; Enemy unit engaged.
speech_event_enemy_unit_destroyed =    sounds/speech/voicepacks/tank-light/enemy_unit_destroyed        ; Enemy unit destroyed.
speech_event_enemy_host_destroyed =    sounds/speech/voicepacks/tank-light/enemy_host_destroyed        ; Enemy Host Station destroyed.
speech_event_powerstation_captured =   sounds/speech/voicepacks/tank-light/powerstation_captured       ; Power Station captured.

max_active_at_once = 15         ; Maximum active count for this specific unit type, excluding instances already placed by level definitions. The campaign may raise this limit through GEM unlocks.
add_max_active_at_once = 3      ; GEM upgrade value used inside modify_vehicle to increase and persist max_active_at_once.

invulnerable = 1                ; Makes the unit immune to all damage.

invisible = 1                   ; Makes the unit fully invisible until it attacks, at which point the invisibility bonus is lost.
invisible_reveal_vp = 229                                ; Legacy VP spawned when an invisible unit is revealed; final fallback.
invisible_reveal_base = BASE/FX/REVEAL.BASE              ; BASE family spawned on reveal, relative to Data; falls back to invisible_reveal_vp.
invisible_reveal_3ds = 3DS/FX/reveal.3ds                 ; 3DS model spawned on reveal; takes priority over BASE and VP.

push_resistance = 0.5                ; Resistance level 0-10 against weapon/event push. Also applies to Host Stations; not useful for static gun classes.
push_at_death_force     = 10         ; AOE push intensity 0-10 generated when the unit dies.
push_at_death_radius    = 1200       ; Radius of the unit's death AOE push.
push_at_death_falloff   = 1          ; 1 decreases AOE push strength with distance from the epicenter; 0 keeps uniform strength throughout the radius.

cockpit_camera_offset_x = 0         ; Cockpit camera X offset.
cockpit_camera_offset_y = 0         ; Cockpit camera Y offset.
cockpit_camera_offset_z = 0         ; Cockpit camera Z offset.
cockpit_gun_camera_recoil   = 2.0   ; 0..5 multiplier for cockpit camera recoil from the gun. Does not alter physics, aiming or projectile origin.

pal_airexplode_slot      = 4                    ; Palette-effect slot used when an airborne vehicle explodes in the air.
pal_airexplode_time      = 1000                 ; Air-explosion palette-effect duration in milliseconds.
pal_airexplode_mag0      = 1                    ; Initial air-explosion palette intensity.
pal_airexplode_mag1      = 0                    ; Final air-explosion palette intensity.
pal_airexplode_radius    = 5000                 ; Maximum palette-effect radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
shk_airexplode_slot      = 1                    ; Shake slot used when an airborne vehicle explodes in the air.
shk_airexplode_time      = 1000                 ; Air-explosion shake duration in milliseconds.
shk_airexplode_mag0      = 2                    ; Initial air-explosion shake intensity.
shk_airexplode_mag1      = 0                    ; Final air-explosion shake intensity.
shk_airexplode_radius   = 5000                  ; Maximum shake radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy shk_airexplode_mute behavior.
snd_airexplode_sample    = sounds/Smex02.wav    ; Sound played when an airborne vehicle explodes in the air.
snd_airexplode_volume    = 120                  ; Air-explosion sound volume.
snd_airexplode_pitch     = 0                    ; Air-explosion sound pitch.
snd_airexplode_radius  = 5000                   ; Maximum air-explosion sound radius. Volume decreases linearly to 0 at the limit. 0 or absent = legacy behavior.

; Main vehicle visuals can be supplied independently for each lifecycle state.
; External assets extend, rather than remove, the original VP states.

base_normal = BASE/VEHICLE.BASE             ; External BASE model for normal state; automatically falls back to vp_normal.
base_fire = BASE/VEHICLE_FIRE.BASE          ; External BASE model for fire state; automatically falls back to vp_fire.
base_wait = BASE/VEHICLE_WAIT.BASE          ; External BASE model for wait state; automatically falls back to vp_wait.
base_dead = BASE/VEHICLE_DEAD.BASE          ; External BASE model for dead state; automatically falls back to vp_dead.
base_megadeth = BASE/VEHICLE_MEGADETH.BASE  ; External BASE model for megadeth state; automatically falls back to vp_megadeth.
base_genesis = BASE/VEHICLE_GENESIS.BASE    ; External BASE model for genesis state; automatically falls back to vp_genesis.

3ds_normal = 3DS/vehicle.3ds                ; External 3DS model for normal state; takes priority over base_normal and vp_normal.
3ds_fire = 3DS/vehicle_fire.3ds             ; External 3DS model for fire state; takes priority over base_fire and vp_fire.
3ds_wait = 3DS/vehicle_wait.3ds             ; External 3DS model for wait state; takes priority over base_wait and vp_wait.
3ds_dead = 3DS/vehicle_dead.3ds             ; External 3DS model for dead state; takes priority over base_dead and vp_dead.
3ds_megadeth = 3DS/vehicle_megadeth.3ds     ; External 3DS model for megadeth state; takes priority over base_megadeth and vp_megadeth.
3ds_genesis = 3DS/vehicle_genesis.3ds       ; External 3DS model for genesis state; takes priority over base_genesis and vp_genesis.

visual_scale_x = 1.0                                ; X-axis visual scale of the active main VP/BASE/3DS model. Default: 1.0.
visual_scale_y = 1.0                                ; Y-axis visual scale of the active main VP/BASE/3DS model. Default: 1.0.
visual_scale_z = 3.0                                ; Z-axis visual scale of the active main VP/BASE/3DS model. Default: 1.0.

visual_spin_x = 0                                   ; X spin intensity of the active main VP/BASE/3DS model: 0-10, decimals allowed; 0 = no spin.
visual_spin_y = 0                                   ; Y spin intensity of the active main VP/BASE/3DS model: 0-10, decimals allowed; 0 = no spin.
visual_spin_z = 10                                  ; Z spin intensity of the active main VP/BASE/3DS model: 0-10, decimals allowed; 0 = no spin.


visual_rotation_x = 0                               ; Fixed visual rotation in degrees around the X axis of the active main VP/BASE/3DS model. 0 or absent = no rotation.
visual_rotation_y = 0                               ; Fixed visual rotation in degrees around the Y axis of the active main VP/BASE/3DS model. 0 or absent = no rotation.
visual_rotation_z = 0                               ; Fixed visual rotation in degrees around the Z axis of the active main VP/BASE/3DS model. 0 or absent = no rotation.

visual_tint = 40_120_255_255           ; RGBA tint applied to the active main VP/BASE/3DS visual.
wireframe_tint  = 255_95_70_255        ; RGBA tint used by weapon interfaces and vehicle wireframe presentation where supported.

; These AI distance parameters replace the old paired sector/bact values with a
; clearer three-stage attack loop: acquire/attack, retreat when too close, then
; re-engage after enough separation has been recovered.

ai_attack_range   = 2100          ; Replaces adist_sector and adist_bact. Maximum distance at which the AI may attack its target.
ai_retreat_range  = 140           ; Replaces sdist_sector and sdist_bact. Below this distance, the AI breaks off the attack and moves away.
ai_reengage_range = 550           ; Distance the AI must reach while retreating before it is allowed to attack again.

; Mobile Power turns a vehicle into an energy source using the same broader
; energy ecosystem as stationary power sources, while allowing its feedback to
; be defined through a reusable FX profile.

power         = 130                                     ; Amount of mobile energy generated for this vehicle and nearby allied units.
power_radius  = 2400                                    ; Radius within which the vehicle supplies energy to itself and nearby allies.
power_falloff = 1                                       ; 1 reduces Power effect strength with distance; 0 keeps it uniform within power_radius.
power_fx_profile = Scripts/FX_Profiles/mobile_power.txt ; External FX profile containing visual/audio definitions associated with the vehicle's Power system.

; Vehicle/Weapon decoration FX use the same periodic/persistent concept as
; building decorations, but positions are relative to the parent object.

decoration_fx_mode = periodic                 ; Periodic mode: generates decorations intermittently using the parameters below.
decoration_fx_vp = 99                         ; Legacy VP decoration visual; final fallback.
decoration_fx_base = BASE/FX/DECORATION.BASE  ; BASE decoration family, relative to Data; falls back to decoration_fx_vp.
decoration_fx_3ds = 3DS/FX/decoration.3ds     ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_x = 1.0                   ; X scale of the active decoration visual.
decoration_fx_scale_y = 1.0                   ; Y scale of the active decoration visual.
decoration_fx_scale_z = 1.0                   ; Z scale of the active decoration visual.
decoration_fx_spin_x = 0                      ; X spin intensity of the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_y = 0                      ; Y spin intensity of the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_z = 0                      ; Z spin intensity of the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_tint = 255_95_70_200            ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_in = 500                   ; Main decoration VP/3DS fade-in in milliseconds. 0 or absent = immediate appearance.
decoration_fx_fade_out = 500                  ; Main decoration VP/3DS fade-out in milliseconds. 0 or absent = immediate disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255 ; RGBA tint of VP decoration particles/trails. Alpha 0 = invisible.
decoration_fx_vp_trail_scale_x = 1.0          ; X scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_y = 1.0          ; Y scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_z = 1.0          ; Multiplier for VP particle/trail duration and therefore apparent trail length.
decoration_fx_vp_trail_fade_in = 500          ; Time in milliseconds for VP trails/particles to fade from invisible to configured opacity. 0 or absent = immediate.
decoration_fx_vp_trail_fade_out = 500         ; Time in milliseconds for VP trails/particles to fade to invisible. 0 or absent = immediate.
decoration_fx_duration = 1000                 ; Total duration in milliseconds of each periodic decoration.
decoration_fx_interval = 500_1500             ; Random interval in milliseconds between decoration spawns. A single value gives a fixed interval.
decoration_fx_count = 2_7                     ; Random number of decorations generated per spawn. A single value gives a fixed count.
decoration_fx_random_pos = 90                 ; XYZ position randomization around the parent Vehicle/Weapon center.
decoration_fx_offset_x = 0                    ; X offset from the parent Vehicle/Weapon center.
decoration_fx_offset_y = 0                    ; Y offset from the parent Vehicle/Weapon center.
decoration_fx_offset_z = -40                  ; Z offset from the parent Vehicle/Weapon center.

decoration_fx_mode = persistent               ; Persistent mode: decoration remains active while the parent Vehicle/Weapon remains active.
decoration_fx_vp = 99                         ; Legacy VP decoration visual; final fallback.
decoration_fx_base = BASE/FX/DECORATION.BASE  ; BASE decoration family, relative to Data; falls back to decoration_fx_vp.
decoration_fx_3ds = 3DS/FX/decoration.3ds     ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_x = 1.0                   ; X scale of the active decoration visual.
decoration_fx_scale_y = 1.0                   ; Y scale of the active decoration visual.
decoration_fx_scale_z = 1.0                   ; Z scale of the active decoration visual.
decoration_fx_spin_x = 0                      ; X spin intensity of the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_y = 0                      ; Y spin intensity of the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_z = 0                      ; Z spin intensity of the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin.
decoration_fx_tint = 255_95_70_200            ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_in = 500                   ; Main decoration VP/3DS fade-in in milliseconds. 0 or absent = immediate appearance.
decoration_fx_fade_out = 500                  ; Main decoration VP/3DS fade-out in milliseconds. 0 or absent = immediate disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255 ; RGBA tint of VP decoration particles/trails. Alpha 0 = invisible.
decoration_fx_vp_trail_scale_x = 1.0          ; X scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_y = 1.0          ; Y scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_z = 1.0          ; Multiplier for VP particle/trail duration and therefore apparent trail length.
decoration_fx_vp_trail_fade_in = 500          ; Time in milliseconds for VP trails/particles to materialize to configured opacity. 0 or absent = immediate.
decoration_fx_vp_trail_fade_out = 500         ; Time in milliseconds for VP trails/particles to fade out when the decoration ends. 0 or absent = immediate.
decoration_fx_offset_x = 0                    ; X offset from the parent Vehicle/Weapon center.
decoration_fx_offset_y = 0                    ; Y offset from the parent Vehicle/Weapon center.
decoration_fx_offset_z = -40                  ; Z offset from the parent Vehicle/Weapon center.

; Damaged-state visuals are coupled to optional gameplay penalties. This means
; the damaged state can be purely cosmetic, or it can also reduce movement,
; turning and weapon cadence once the configured HP threshold is crossed.

damaged_fx_vp = 138_138_138                ; VP visuals generated while the unit is damaged. Multiple VP IDs may be separated by _. Repeated damaged_fx_3ds lines can add 3DS visuals.
damaged_fx_3ds = 3DS/FX/damaged.3ds        ; Optional damaged-state 3DS model. Repeat the line to add multiple 3DS candidates to the random visual selection alongside VP entries.
damaged_fx_scale = 1.0                     ; Uniform scale applied to generated damaged visuals, both VP and 3DS.
damaged_fx_threshold     = 30%             ; HP threshold below which damaged FX activate. With %, uses maximum HP; without %, uses a fixed HP amount.
damaged_fx_count = 1_3                     ; Random number of damaged FX generated per trigger. A single value gives a fixed count. Runtime maximum: 32.
damaged_fx_interval = 500_1500             ; Random interval in milliseconds between damaged-FX triggers. A single value gives a fixed interval.
damaged_fx_random_max_offset = 25%         ; Maximum random offset from the unit center. With %, uses unit size; without %, uses a fixed distance.
damaged_fx_trail_only    = 1               ; 1 hides the main VP model while keeping its trails, particles and child effects active.
damaged_force_malus      = -50%            ; Force modifier while damaged. Example: -50% reduces force by 50%.
damaged_maxrot_malus     = -50%            ; maxrot modifier while damaged. Example: -50% reduces maxrot by 50%.
damaged_mgun_shot_time_malus = -50%        ; MGUN fire-rate modifier while damaged. Example: -50% reduces MGUN rate of fire by 50%; 0 or absent = unchanged.
damaged_shot_time_malus      = -50%        ; Weapon fire-rate modifier while damaged. Example: -50% reduces Weapon rate of fire by 50%; 0 or absent = unchanged.
damaged_snd_pitch        = -50%            ; Pitch modifier for sounds emitted by the damaged unit. Negative values lower pitch; positive values raise it. 0 or absent = unchanged.

; MGUN is OpenNeoUA's shared hitscan machine-gun path. The same system is used
; by ordinary vehicle MGUNs and by gun_type = mg, including shared range,
; recoil timing, tracer rendering and decal behavior.

mgun_name       =   MGUN               ; gun_type = mg only: name shown in the MGUN Weapon interface. If both this and mgun_wireframe are absent, the MGUN interface is not shown.
mgun_wireframe  = wireless/otlw38.sklt ; gun_type = mg only: wireframe shown in the MGUN Weapon interface. If both this and mgun_name are absent, the MGUN interface is not shown.
num_mguns                  =   2       ; Number of MGUN barrels/machine guns available to the unit; used with mgun_spread_* and mgun_shot_time.
mgun_spread_x              =   20      ; Horizontal left/right MGUN spread.
mgun_spread_y              =   20      ; Vertical up/down MGUN spread.
mgun_power	               =   9000    ; MGUN damage. If absent, falls back to legacy gun_power.
mgun_angle   	             =   0       ; MGUN angle. If absent, falls back to legacy gun_angle.
mgun_vp_dead = 99                                    ; Legacy VP for the MGUN dead impact; final fallback.
mgun_base_dead = BASE/FX/MGUN_DEAD.BASE              ; BASE family for the MGUN dead impact; falls back to mgun_vp_dead.

mgun_3ds_dead = 3DS/FX/mgun_dead.3ds                 ; 3DS model for the dead impact; takes priority over BASE and VP.
mgun_vp_megadeth = 99                                ; Legacy VP for the MGUN megadeth impact; final fallback.
mgun_base_megadeth = BASE/FX/MGUN_MEGADETH.BASE      ; BASE family for the megadeth impact; falls back to mgun_vp_megadeth.
mgun_3ds_megadeth = 3DS/FX/mgun_megadeth.3ds         ; 3DS model for the megadeth impact; takes priority over BASE and VP.
mgun_shot_time             =   100                   ; Shared MGUN fire interval/rate setting for player and AI.
mgun_shot_time_user        =   100                   ; Player-specific MGUN fire interval/rate; absent or zero uses mgun_shot_time.
mgun_recoil                =   0.5                   ; 0-10 visual MGUN recoil intensity in third person / on the unit.
mgun_recoil_cockpit        =   1.5                   ; 0-10 MGUN SHK/camera-shake intensity in the player's cockpit. Independent from mgun_recoil and does not apply physical recoil.
mgun_fire_energy_cost      =   0.05%                 ; Energy cost per MGUN shot. 0 or absent = no cost.
mgun_mesh_tracer_enable    =   0                     ; 1 enables configurable MGUN tracers, including gun_type = mg. Uses the same tracer renderer as physical Weapons.
mgun_mesh_tracer_path    = 3DS/mgun_tracer_cross.3ds ; Data-relative external 3DS mesh used by the MGUN tracer.
mgun_mesh_tracer_tint        = 255_210_80_180        ; General R_G_B_A tint of the MGUN mesh tracer. Alpha 0 disables the effect.
mgun_mesh_tracer_head_tint   = 255_210_80_180        ; R_G_B_A tint of the MGUN tracer head. Absent = mgun_mesh_tracer_tint.
mgun_mesh_tracer_tail_tint   = 255_210_80_180        ; R_G_B_A tint of the MGUN tracer tail. Absent = mgun_mesh_tracer_tint.
mgun_mesh_tracer_size_z      = 300                   ; Maximum visible Z length of the MGUN tracer along the already-resolved hitscan ray. Range 0..6000; 0/invalid disables.
mgun_mesh_tracer_size_x      = 3                     ; Base X width of the MGUN tracer. Range 0..100; 0/invalid disables.
mgun_mesh_tracer_size_y      = 3                     ; Y size of the MGUN tracer. Range 0..100; absent/invalid inherits size_x.
mgun_mesh_tracer_pos_x       = 0                     ; Local X position relative to the MGUN origin.
mgun_mesh_tracer_pos_y       = 0                     ; Local Y position relative to the MGUN origin.
mgun_mesh_tracer_pos_z       = 0                     ; Local Z position relative to the MGUN origin.
mgun_mesh_tracer_head_size    = 3                    ; Uniform X/Y size of the tracer head. Range 0..100; 0 makes a pointed head; absent/invalid uses size_x/size_y. Z length remains controlled only by size_z so the tracer stays continuous.
mgun_mesh_tracer_tail_size    = 3                    ; Uniform X/Y size of the tracer tail. Range 0..100; 0 closes the tail; absent/invalid uses size_x/size_y. Z length remains controlled only by size_z.
mgun_mesh_tracer_glow_rate   = 0                     ; Tracer glow intensity, range 0..10. Changes brightness only, not dimensions.
mgun_mesh_tracer_noise_rate  = 0                     ; Stable random visual distortion/noise intensity, range 0..10. 0 = disabled.
mgun_mesh_tracer_pulse_rate  = 0                     ; Width-pulsation intensity, range 0..10. 0 = disabled.
mgun_mesh_tracer_pulse_speed = 0                     ; Pulsation speed in cycles per second, range 0..10. 0 = disabled; requires mgun_mesh_tracer_pulse_rate > 0.

; MGUN impact decals are optional and independent from the tracer itself.
mgun_decal_enable = 0                  ; Only the exact value 1 enables ground decals on MGUN impacts. Absent or any other value = no decal.
mgun_decal_texture = GroundDecals/impact_scorch.png ; Optional MGUN decal texture. Empty = procedural shape without texture; unloadable path = decal discarded.
mgun_decal_points = 12                 ; Number of points in the procedural MGUN decal border. Valid range 3..32; out-of-range values are clamped; invalid = 12.
mgun_decal_jaggedness = 35             ; Correlated border irregularity, 0..100. 0 = regular; 100 = strongly jagged; invalid = 35.
mgun_decal_size = 30                   ; MGUN decal width in world units. Absent/invalid/<= 0 = decal disabled.
mgun_decal_tint = 255_255_255_255      ; MGUN decal RGBA tint. Final component directly controls opacity 0..255; alpha 0 disables the decal.
mgun_decal_random_rotation = 1         ; Only exact value 1 enables deterministic random rotation. Any other value = 0.
mgun_decal_edge_fade = 0.0              ; Radial edge fade 0.0..10.0. 0.0 = hard border as today; 10.0 = fully transparent at the rim, opaque at the center. Out-of-range clamped; invalid = 0.0.
mgun_decal_duration = 10000            ; Total MGUN decal lifetime in milliseconds. 0 or invalid = no decal.
mgun_decal_fade_in = 0                 ; MGUN decal fade-in in milliseconds. 0 or absent = immediate appearance.
mgun_decal_fade_out = 2000             ; Final MGUN decal fade-out in milliseconds. 0 or absent = immediate removal at expiration.

; Multi-projectile aiming can combine independent random spread, fixed arc and
; uniform cone distribution. These values affect player fire and AI fire using
; the same weapon definition.

weapon_spread_x              =   20       ; Independent random horizontal X spread for each projectile. Applied the same way for the player.
weapon_spread_y              =   20       ; Independent random vertical Y spread for each projectile. Applied the same way for the player.
weapon_arc_x                 =   0        ; Fixed horizontal X arc offset for each projectile. Applied the same way for the player.
weapon_arc_y                 =   0        ; Fixed vertical Y arc offset for each projectile. Applied the same way for the player.
weapon_cone_xy               =   0        ; XY cone width for each generated projectile, using a uniform conical distribution.

; fire_x_* controls a virtual firing rack. It is useful for weapons that should
; visibly walk across multiple muzzle positions or alternate entire salvos.

fire_x_mode                  =   sequence ; Projectile X mode: sequence = orderly X cycle; random = random X slot; salve_sequence = each whole salvo starts from one side and the next from the other; salve_mirror = splits one salvo and fires half simultaneously from each side.
fire_x_start                 =   -45      ; Initial X position of the firing rack used by sequence/random.
fire_x_step                  =   10       ; X distance between adjacent firing-rack slots.
fire_x_slots                 =   10       ; Total number of X slots before the rack cycle resets.

; A vehicle can expose up to four Weapon slots. Player and AI switching policies
; are independent, so the same vehicle may be manual for the player and smart
; or sequenced for AI control.

weapon_2               = 2            ; Optional second Weapon slot used by the unit.
weapon_3               = 8            ; Optional third Weapon slot used by the unit.
weapon_4               = 7            ; Optional fourth Weapon slot used by the unit.

weapon_energy_cost     = 0.5%         ; Energy cost per Weapon shot. 0 or absent = vanilla cost behavior.

num_weapons_snd_events = 2            ; Maximum number of complete weapon sound events generated for a multi-projectile shot, preventing excessive overlap when num_weapons is greater than one.

num_weapons_2          = 0            ; Projectile count used by weapon_2. Absent = inherits num_weapons.
num_weapons_3          = 0            ; Projectile count used by weapon_3. Absent = inherits num_weapons.
num_weapons_4          = 0            ; Projectile count used by weapon_4. Absent = inherits num_weapons.

weapon_player_switch_mode = manual     ; Player changes Weapon manually using the mapped dedicated control.
weapon_player_switch_mode = sequence   ; Player Weapon automatically cycles through weapon, weapon_2, weapon_3, ...
weapon_player_switch_mode = random     ; Player Weapon automatically changes to a random configured slot.

weapon_ai_switch_mode = smart          ; AI automatically selects the most effective configured Weapon against the current target.
weapon_ai_switch_mode = sequence       ; AI uses its configured Weapons in sequence.
weapon_ai_switch_mode = random         ; AI selects a random configured Weapon.

; Mobile unit spawners use the same core idea as building spawners, but their
; spawn positions are relative to the parent unit.

spawn_units = 1                ; Enables this unit to spawn other units.
spawn_vehicle = 5              ; Vehicle ID spawned by this unit.
spawn_count = 3                ; Number of units spawned simultaneously per activation. Default: 1.
spawn_interval = 6000          ; Time in milliseconds between spawn activations.
spawn_trigger_radius = 1800    ; Enemy-presence radius that activates spawning.
spawn_random_pos = 200         ; XZ spawn-position randomization around the parent vehicle.
spawn_offset_x = 0             ; Spawn-position X offset from the parent vehicle.
spawn_offset_y = 0             ; Spawn-position Y offset from the parent vehicle.
spawn_offset_z = 0             ; Spawn-position Z offset from the parent vehicle.
spawn_max_active = 9           ; Maximum number of children generated by this unit that may be active simultaneously.
spawn_instant = 1              ; 1 spawns children immediately without the classic Genesis sequence.

; Death spawning is a separate event from the normal mobile spawner and can
; protect newly created children briefly so the parent explosion does not
; immediately erase them.

spawn_at_death_units = 1              ; Enables spawning of child units when this unit dies.
spawn_at_death_vehicle = 5            ; Vehicle ID spawned at death.
spawn_at_death_count = 3              ; Number of children spawned simultaneously at death. Default: 1.
spawn_at_death_random_pos = 30        ; Randomization of child spawn positions at death.
spawn_at_death_instant = 1            ; 1 spawns death-children instantly without the classic Genesis sequence.
spawn_at_death_immunity_time = 2000   ; Damage-immunity time in milliseconds granted to newly generated child units.

; Proximity Defense is an autonomous secondary Weapon system. "classic" reacts
; to nearby enemies repeatedly; "at_death" fires once on unit death.

proximity_defense_enable = 1                  ; Enables the vehicle's automatic Proximity Defense system.
proximity_defense_mode = classic              ; System mode: classic = activates around nearby enemies; at_death = activates once at unit death and fires all projectiles simultaneously.
proximity_defense_weapon = 2                  ; Weapon ID used by Proximity Defense.
proximity_defense_trigger_radius = 1200       ; Enemy-presence distance that activates classic mode.
proximity_defense_interval = 5000             ; Time in milliseconds between projectile bursts in classic mode.
proximity_defense_shots = 20                  ; Number of projectiles created per system activation.
proximity_defense_fire_mode = all_at_once     ; Classic firing mode: all_at_once = all projectiles together; sequential = one after another. at_death always uses all_at_once.
proximity_defense_vp_launch = 70              ; Legacy VP spawned when Proximity Defense projectiles launch; final fallback.
proximity_defense_base_launch = BASE/FX/PROXIMITY_LAUNCH.BASE ; BASE launch family, relative to Data; falls back to VP.
proximity_defense_3ds_launch = 3DS/FX/proximity_launch.3ds    ; 3DS launch model; takes priority over BASE and VP.
proximity_defense_sequence_delay = 100        ; Delay in milliseconds between projectiles when fire_mode = sequential; ignored for all_at_once and at_death.
proximity_defense_vertical_angle = -90_90     ; Projectile vertical angle. Single value = fixed angle; min_max = random angle in range. Absent = 0.
proximity_defense_horizontal_angle = 0_360    ; Projectile horizontal angle. Single value = fixed angle; min_max = random angle in range. If absent, projectiles are distributed uniformly across 360 degrees.


; Universal Unit Guns generalize the original robo-mounted-gun concept so guns
; and functional modules can be attached to ordinary vehicles as well as Host
; Stations. unit_gun_protect optionally turns a mounted gun into a real damage
; layer: the module must be destroyed before the parent can be damaged directly.

unit_num_guns = 2                             ; Evolution of robo_num_guns: number of guns/modules that can be attached to any supported unit, including Host Stations.
unit_act_gun = 0                              ; Selects mounted gun index 0 for the following unit_gun_* definitions.
unit_gun_icon = Interface/StatusIcons/mobile_flak.png   ; Optional Data-relative icon assigned to gun 0 and shown on the parent unit.
unit_gun_pos_x = 0.0                          ; Mounted gun local X position.
unit_gun_pos_y = -200.0                       ; Mounted gun local Y position.
unit_gun_pos_z = 55.0                         ; Mounted gun local Z position.
unit_gun_dir_x = 0.0                          ; Mounted gun initial X direction component.
unit_gun_dir_y = 0.0                          ; Mounted gun initial Y direction component.
unit_gun_dir_z = 1.0                          ; Mounted gun initial Z direction component.
unit_gun_type = 95                	          ; Gun/module type ID.
unit_gun_name = FLAK                          ; Display/internal name assigned to this mounted gun.
unit_gun_protect = 1                          ; 1 makes this gun/module absorb damage and require destruction before direct damage can reach the parent vehicle.
unit_act_gun = 1                              ; Selects mounted gun index 1 for the following unit_gun_* definitions.
unit_gun_icon = Interface/StatusIcons/mobile_radar.png  ; Optional Data-relative icon assigned to gun 1 and shown on the parent unit.
unit_gun_pos_x = 0.0                          ; Mounted gun local X position.
unit_gun_pos_y = -200.0                       ; Mounted gun local Y position.
unit_gun_pos_z = 55.0                         ; Mounted gun local Z position.
unit_gun_dir_x = 0.0                          ; Mounted gun initial X direction component.
unit_gun_dir_y = 0.0                          ; Mounted gun initial Y direction component.
unit_gun_dir_z = 1.0                          ; Mounted gun initial Z direction component.
unit_gun_type = 109                	          ; Gun/module type ID.
unit_gun_name = RADAR                         ; Display/internal name assigned to this mounted gun.
unit_gun_protect = 1                          ; 1 makes this gun/module absorb damage and require destruction before direct damage can reach the parent vehicle.

; Compound collision spheres replace the limitations of a single legacy radius
; with up to 32 manually placed spheres. This is useful for long, asymmetric or
; multi-part units while keeping the collision representation simple and
; data-driven.

coll_num 	  	= 	3      ; Number of manually defined coll_* spheres. Range 0-32; negative values become 0.
coll_act     	=  	0      ; Selects collision sphere index 0. Index is clamped to 0-31.
coll_x       	=  	50     ; Sphere X position relative to unit center.
coll_y       	=  	0      ; Sphere Y position relative to unit center.
coll_z       	=  	0      ; Sphere Z position relative to unit center.
coll_radius  	=  	200    ; Sphere radius.
coll_act     	=  	1      ; Selects collision sphere index 1.
coll_x       	=  	0      ; Sphere X position relative to unit center.
coll_y       	=  	-50    ; Sphere Y position relative to unit center.
coll_z       	=  	0      ; Sphere Z position relative to unit center.
coll_radius  	=  	250    ; Sphere radius.
coll_act     	=  	2      ; Selects collision sphere index 2.
coll_x       	=  	0      ; Sphere X position relative to unit center.
coll_y       	=  	50     ; Sphere Y position relative to unit center.
coll_z       	=  	0      ; Sphere Z position relative to unit center.
coll_radius  	=  	300    ; Sphere radius.

--------------------Weapons:

; Weapon Chain FX use the same visual/physical concepts as vehicle Chain FX, but
; their triggers are tied to projectile impact/detonation. This makes it
; possible to build richer explosions without requiring the old dest_fx ->
; scale_fx relationship.

begin_chain_fx                         ; Visual Chain FX replacing a dest_fx that points to scale_fx.
  trigger    = impact_world o detonate ; Trigger: impact_world = projectile hits terrain/buildings; detonate = projectile hits a unit or detonates in the air.
  mode = visual                        ; Uses start_size/end_size/duration and VP/BASE/3DS visuals.
  offset_x   = -20                     ; Effect X offset.
  offset_y   = 0                       ; Effect Y offset.
  offset_z   = 20                      ; Effect Z offset.
  start_size = 0.1                     ; Initial effect size. 1 = original visual size.
  mid_size   = 1                       ; Intermediate effect size.
  end_size   = 2                       ; Final effect size.
  duration   = 1000                    ; Effect duration in milliseconds.
  fade_in    = 500                     ; Visual fade-in in milliseconds. 0 or absent = immediate.
  fade_out   = 1000                    ; Visual fade-out in milliseconds. 0 or absent = immediate.
  vp_model   = 229                     ; First legacy VP visual in the sequence.
  base_model = BASE/FX/CHAIN_FX.BASE   ; Optional BASE family for the same element. Place after vp_model to preserve VP fallback.
  3ds_model = 3DS/FX/chain_fx.3ds      ; Optional 3DS model for the same element; takes priority over BASE and VP.
  visual_tint = 80_160_255_180         ; RGBA tint associated with the preceding VP/BASE/3DS visual.
  vp_model   = 230                     ; Second visual in the sequence.
  visual_tint = 80_160_255_180         ; RGBA tint associated with the preceding visual.
  vp_model   = 231                     ; Third visual in the sequence.
  visual_tint = 80_160_255_180         ; RGBA tint associated with the preceding visual.
end

begin_chain_fx                       ; Physical Chain FX replacing a dest_fx without scale_fx.
  trigger = impact_world o detonate  ; Trigger: terrain/building impact or unit/air detonation.
  mode             = physical        ; Uses physical_vehicle for physical and visual properties.
  offset_x         = -20             ; Physical vehicle X offset.
  offset_y         = 0               ; Physical vehicle Y offset.
  offset_z         = 20              ; Physical vehicle Z offset.
  physical_vehicle = 41              ; Vehicle ID whose physical and visual properties are used by this Chain FX.
end

; Ground-decal Chain FX attach a persistent footprint to the actual terrain
; collision geometry. They only appear after a real projectile/world collision,
; so they are not a generic screen-space scorch effect.

begin_chain_fx
  trigger = impact_world              ; Required: decal is created only after a real missile/terrain collision.
  mode = ground_decal                 ; Enables a procedural terrain-conforming decal; supported by Weapon prototypes.
  texture = GroundDecals/impact_scorch.png ; Ground decal texture.
  points = 24                         ; Number of procedural border points. Valid range 3..32; out-of-range values are clamped.
  jaggedness = 28                     ; Correlated border irregularity 0..100. 0 = regular; 100 = strongly jagged.
  size = 120                          ; Footprint width in world units. Lower = smaller, higher = larger. Zero/negative/invalid disables the block.
  duration = 30000                    ; Total lifetime in milliseconds, including fade-in and fade-out. Must be positive.
  fade_in = 250                       ; Fade-in duration in milliseconds. 0 or absent = immediate.
  fade_out = 5000                     ; Final fade-out in milliseconds. 0 or absent = remove immediately at expiration.
  tint = 255_255_255_255              ; R_G_B_A multiplier for color/texture. Final component directly controls opacity 0..255.
  random_rotation = 1                 ; Only exact value 1 enables random decal rotation; any other value = 0.
  edge_fade = 0.0                       ; Radial edge fade 0.0..10.0. 0.0 = hard border; 10.0 = fully transparent at the rim, opaque at the center. Out-of-range clamped; invalid = 0.0.
end

; Weapons can also use state-based external visuals. As elsewhere, 3DS has
; priority over BASE, and BASE falls back to the corresponding VP.

base_normal = BASE/VEHICLE.BASE             ; External BASE model for normal state; falls back to vp_normal.
base_fire = BASE/VEHICLE_FIRE.BASE          ; External BASE model for fire state; falls back to vp_fire.
base_wait = BASE/VEHICLE_WAIT.BASE          ; External BASE model for wait state; falls back to vp_wait.

base_dead = BASE/VEHICLE_DEAD.BASE          ; External BASE model for dead state; falls back to vp_dead.
base_megadeth = BASE/VEHICLE_MEGADETH.BASE  ; External BASE model for megadeth state; falls back to vp_megadeth.
base_genesis = BASE/VEHICLE_GENESIS.BASE    ; External BASE model for genesis state; falls back to vp_genesis.

3ds_normal = 3DS/vehicle.3ds                ; External 3DS model for normal state; takes priority over base_normal and vp_normal.
3ds_fire = 3DS/vehicle_fire.3ds             ; External 3DS model for fire state; takes priority over base_fire and vp_fire.
3ds_wait = 3DS/vehicle_wait.3ds             ; External 3DS model for wait state; takes priority over base_wait and vp_wait.
3ds_dead = 3DS/vehicle_dead.3ds             ; External 3DS model for dead state; takes priority over base_dead and vp_dead.
3ds_megadeth = 3DS/vehicle_megadeth.3ds     ; External 3DS model for megadeth state; takes priority over base_megadeth and vp_megadeth.
3ds_genesis = 3DS/vehicle_genesis.3ds       ; External 3DS model for genesis state; takes priority over base_genesis and vp_genesis.

; Damage multipliers can distinguish newer/specialized model classes while
; preserving the older flyer/tank families as fallbacks.

energy_plane     = 1.0              ; Damage multiplier against model = plane. Absent = energy_flyer.
energy_glider    = 1.0              ; Damage multiplier against model = glider. Absent = energy_flyer.
energy_zeppelin  = 1.0              ; Damage multiplier against model = zeppelin. Absent = energy_flyer.
energy_cruiser   = 1.0              ; Damage multiplier against model = cruiser. Absent = energy_flyer.
energy_ufo       = 1.0              ; Damage multiplier against model = ufo. Absent = energy_flyer.
energy_car       = 1.0              ; Damage multiplier against model = car. Absent = energy_tank.
energy_gun       = 1.0              ; Damage multiplier against model = gun/module. Absent = generic vanilla 1.0.

add_energy_plane     = 1.0          ; In modify_weapon, adds to energy_plane. If undefined, starts from energy_flyer.
add_energy_glider    = 1.0          ; In modify_weapon, adds to energy_glider. If undefined, starts from energy_flyer.
add_energy_zeppelin  = 1.0          ; In modify_weapon, adds to energy_zeppelin. If undefined, starts from energy_flyer.
add_energy_cruiser   = 1.0          ; In modify_weapon, adds to energy_cruiser. If undefined, starts from energy_flyer.
add_energy_ufo       = 1.0          ; In modify_weapon, adds to energy_ufo. If undefined, starts from energy_flyer.
add_energy_car       = 1.0          ; In modify_weapon, adds to energy_car. If undefined, starts from energy_tank.
add_energy_gun       = 1.0          ; In modify_weapon, adds to energy_gun. If undefined, starts from generic vanilla 1.0.

; New Weapon models are selected with the existing model field, keeping the
; system data-driven instead of introducing parallel weapon-definition formats.

model  = homing_bomb                 ; Homing bomb Weapon class that pursues enemy targets.

model = arc_grenade                  ; True ballistic arc-grenade Weapon. Flight uses start_speed, grenade_arc_angle and grenade_arc_gravity; force does not control the trajectory.
grenade_arc_angle = 60               ; Initial vertical launch angle in degrees.
grenade_arc_gravity = 35             ; Gravity applied during projectile flight, controlling how quickly it falls. 0/absent/invalid = engine-standard gravity.

model = kamikaze                      ; Kamikaze Weapon class: converts the firing unit into a kamikaze that approaches enemies and then detonates.
trigger_radius = 360                  ; Kamikaze only: radius within which the kamikaze may detonate against units or sectors.
fire_time_scale = 0.35                ; Kamikaze, player only: time-scale intensity activated while pressing FIRE.
fire_time_scale_hp_drain = 12%        ; Kamikaze, player only: HP drained per second during slow motion. With %, uses maximum HP; without %, uses fixed HP. 0 or absent = disabled.

; Artillery Shell supports both a real ballistic trajectory and an emulated
; vertical-barrage mode. Manual targeting is integrated with the Tactical Map;
; automatic targeting remains available unless explicitly disabled.

model = artillery_shell                  ; Artillery/mortar Weapon class with barrage fire, manually controllable from the Tactical Map or managed automatically.
artillery_shell_mode = vertical_barrage  ; ballistic = projectile reaches the target area along a real arc; vertical_barrage = emulated barrage where rounds climb out of view and descend vertically.
artillery_shell_fall_delay = 2500        ; vertical_barrage only: delay before projectiles begin descending from the sky toward targets.
artillery_shell_vertical_spread_x = 2    ; vertical_barrage only: X spread while projectiles rise vertically.
artillery_shell_vertical_spread_z = 2    ; vertical_barrage only: Z spread while projectiles rise vertically.
artillery_shell_speed = 1800             ; Projectile speed used by both modes.
artillery_shell_min_range = 1600         ; Minimum XZ distance from the source at which a barrage area may be selected manually or acquired automatically.
artillery_shell_max_range = 8500         ; Maximum XZ distance at which a barrage area may be selected manually or acquired automatically.
artillery_shell_requires_radar = 1       ; 1 requires the target area to be visible on the faction radar; 0 permits targeting unrevealed areas.
artillery_shell_barrage_radius = 900     ; Radius of the bombarded area.
artillery_shell_barrage_shots = 5        ; Total number of projectiles available per barrage.
artillery_shell_barrage_shot_delay = 550 ; Time in milliseconds between successive shots in a barrage.
artillery_shell_barrage_cooldown = 14000 ; Mortar cooldown in milliseconds, starting after the last projectile of the barrage is launched.
artillery_shell_arc_height = 3300        ; ballistic: maximum projectile arc height; vertical_barrage: climb/descent altitude used above the target.
artillery_shell_airburst = 0             ; 1 detonates rounds at target altitude (airburst); 0 waits for the real terrain impact point.
artillery_shell_manual_mode_only = 0     ; 1 leaves only player manual targeting available; 0 also permits automatic acquisition.
artillery_shell_marker_path = artillery_ring_classic.svg ; SVG marker path relative to Data/Interface/Map/Markers. Empty/missing/invalid falls back to artillery_ring_classic.svg.

; Laser replaces a physical projectile with a continuous beam. Damage is tick-
; based, can ramp against the same target, can chain to nearby units and can be
; rendered either with the legacy repeated visual or an external mesh.

model = laser                         ; Continuous laser Weapon instead of a physical projectile.
vertical_laser_enable = 1             ; 1 converts model = laser to vertical-fire mode. 0/absent = normal Laser. There is no separate vertical_laser model.
vertical_laser_ai_trigger_radius = 30 ; Vertical mode, AI only: XZ distance from an enemy at which AI activates vertical fire. Does not change beam range or thickness.
laser_energy_tick_time = 150          ; Damage-tick interval in milliseconds when the Laser is used by AI.
laser_energy_tick_time_user = 150     ; Damage-tick interval in milliseconds when the Laser is used by the player.
laser_energy_increment_rate = 500     ; Amount by which Laser damage increases on each successive tick against the same target.
laser_visual_spacing = 20             ; Spacing between normal-state visual instances used to build the legacy VP/BASE/3DS beam. Lower values produce a denser beam.
laser_max_energy = 50000              ; Maximum damage the Laser may reach through progressive increase.
laser_chain_allow = 1                 ; Enables the Laser to propagate from one hit unit to nearby units.
laser_chain_max_jumps = 6             ; Maximum number of additional unit-to-unit jumps after the first target.
laser_chain_radius = 1200             ; Radius around the last hit unit used to search for the next chain target.
laser_chain_damage_mult = 0.8         ; Damage multiplier applied at each chain jump. 1.0 = no loss; 0.8 = each jump retains 80% of the previous damage.
laser_beam_count = 5                  ; Number of direct Laser beams the source may generate. 0 or 1 keeps a single beam.
laser_mesh_enable = 0                 ; 1 enables mesh-based Laser rendering and disables the legacy beam assembled from the normal visual.
laser_mesh_path = 3DS/laser.3ds       ; External 3DS mesh path used for the Laser beam.
laser_mesh_tint = 255_255_255_255     ; RGBA tint of the mesh Laser beam.
laser_mesh_size_x = 5                 ; X width of the mesh Laser beam.
laser_mesh_size_y = 5                 ; Y width of the mesh Laser beam.
laser_mesh_glow_rate = 1.0            ; Additive glow intensity, 0..10. Invalid disables only glow.
laser_mesh_pulse_rate = 0.0           ; Light-pulse amplitude, 0..10. 0 or invalid disables only pulse.
laser_mesh_pulse_speed = 0.0          ; Pulse speed in cycles per second, 0..10. 0 or invalid disables only pulse.
laser_mesh_noise_rate = 0.0           ; Deterministic lateral beam distortion, 0..10. 0 or invalid leaves the segment straight.
laser_mesh_impact_fade_length = 150   ; Fade length near real contact with units, terrain or buildings. 0/invalid = no fade. Does not modify hits, damage or collision.
life_time = 4500                      ; Vanilla parameter; for Laser, controls maximum beam duration/length.
snd_launch_sample = sounds/Laser.WAV  ; Laser-specific behavior: non-looping launch sound played when FIRE begins/is held.
snd_launch_volume = 100
snd_launch_pitch  = 1000
snd_normal_sample = sounds/Laser.WAV  ; Laser-specific behavior: continuous looping sound used while the Laser is firing.
snd_normal_volume = 100
snd_normal_pitch  = 1000
snd_hit_sample = sounds/LaserHit.WAV  ; Laser-specific behavior: serialized one-shot hit sound while the Laser contacts a surface. Continuous contact repeats it without overlapping instances.
snd_hit_volume = 100
snd_hit_pitch  = 1000

multi_target      =   10              ; Maximum simultaneous targets/projectiles managed by missile and homing_bomb only. Effective limit = min(multi_target, projectile count of the active slot).

weapon_use_vehicle_fire_visual = 1    ; 1 temporarily switches the firing Vehicle to its own fire-state visual when this Weapon fires. Works with VP, BASE or 3DS.

delay_time            =   8000        ; Delayed detonation against units: projectile attaches to the target and explodes when the timer expires.

vp_launch = 130                       ; Legacy VP generated when the projectile launches; final fallback.
base_launch = BASE/FX/LAUNCH.BASE     ; BASE family generated at launch, relative to Data; falls back to vp_launch.
3ds_launch = 3DS/FX/launch.3ds        ; 3DS model generated at launch; takes priority over base_launch and vp_launch.


launch_scale = 1.0                    ; Uniform X/Y/Z scale of the VP/BASE/3DS launch visual. <= 0 or invalid = 1.0.

push          =   4                   ; Target push intensity 0-10. Standalone GUNs remain excluded; when an attached GUN is hit, push is transferred once to its valid parent and uses the parent's push_resistance.

recoil = 0.5                          ; Primary Weapon recoil, range 0-10. Compatible vehicles keep their existing recoil behavior; on gun/flak model = gun, only the firing gun model tilts visually without physically moving the gun or parent. 0 or absent disables the effect.

armor_penetration_targets = 2         ; Number of units the Weapon may penetrate before stopping.

; Spiral and Chaos are alternative projectile-motion modifiers. If both are
; configured and valid, Chaos takes priority.

spiral_speed = 2.5          ; Projectile spiral turns per second. Range 0-10, decimals allowed; 0 = disabled.
spiral_radius = 30          ; Radius of the projectile spiral around its central trajectory.

chaos_factor = 2.5          ; Chaotic-motion strength: increases the frequency of smooth random direction changes. Range 0-10, decimals allowed; 0 = disabled. Chaos takes priority when both Chaos and Spiral are valid.
chaos_radius = 30           ; Maximum random-deviation radius around the central projectile trajectory. Runtime range 0-1000.

; Progressive fire rate accelerates a continuously firing Weapon from its
; normal shot interval toward a configured minimum. Releasing FIRE or breaking
; the sequence resets the ramp.

ramp_up_time = 3000         ; Time in milliseconds to reduce shot interval progressively from normal shot_time/shot_time_user to ramp_up_max_shot_time. 0/absent/invalid = disabled.
ramp_up_max_shot_time = 100 ; Minimum shot interval reached at the end of ramp_up_time. Ramp progress resets when FIRE is released or the sequence is interrupted.

; AOE separates direct-hit damage from nearby unit/building/sector effects. The
; direct-hit target is excluded from aoe_unit_energy to prevent double damage
; and instead receives the Weapon's normal energy value.

aoe_falloff             =   1          ; 1 reduces AOE effect strength with distance; 0 keeps it uniform within the configured radius.
aoe_unit_radius         =   400        ; Weapon AOE radius against nearby units.
aoe_unit_energy         =   4000       ; AOE damage against nearby units. The direct-hit target is excluded to prevent double damage and receives normal energy instead.
aoe_unit_push           =   10         ; Radial AOE push intensity 0-10. Falloff and push_resistance modify intensity before conversion. GUN classes are excluded.
aoe_building_radius     =   400        ; Weapon AOE radius against nearby special buildings.
aoe_building_energy     =   4000       ; Weapon AOE damage against nearby special buildings.
aoe_sector_radius       =   400        ; Weapon AOE radius against nearby sector buildings.
aoe_sector_energy       =   4000       ; Weapon AOE damage against nearby sector buildings.

; Physical Weapon mesh tracers are an additional visual layer. They follow the
; real projectile trajectory and are rendered alongside the main VP/BASE/3DS
; projectile visual. They do not change trajectory, speed, collision or damage.

mesh_tracer_enable = 1                          ; 1 enables a configurable 3DS mesh tracer for physical Weapons.
mesh_tracer_path    = 3DS/mgun_tracer_cross.3ds ; External 3DS mesh used by the Weapon tracer.
mesh_tracer_tint        = 255_80_80_180         ; General R_G_B_A tracer tint. Alpha 0 disables the effect.
mesh_tracer_head_tint   = 255_80_80_180         ; R_G_B_A tint of the tracer head. Absent = mesh_tracer_tint.
mesh_tracer_tail_tint   = 255_80_80_180         ; R_G_B_A tint of the tracer tail. Absent = mesh_tracer_tint.
mesh_tracer_size_z      = 100                   ; Maximum visible Z length along the Weapon's real trajectory. Range 0..6000; 0/invalid disables.
mesh_tracer_size_x      = 4                     ; Base X width of the tracer. Range 0..100; 0/invalid disables.
mesh_tracer_size_y      = 4                     ; Y size of the tracer. Range 0..100; absent/invalid inherits size_x.
mesh_tracer_pos_x       = 0                     ; Local X position relative to Weapon launch point. Clamped to -6000..6000.
mesh_tracer_pos_y       = 0                     ; Local Y position relative to Weapon launch point. Clamped to -6000..6000.
mesh_tracer_pos_z       = 0                     ; Local Z position relative to Weapon launch point. Clamped to -6000..6000.
mesh_tracer_head_size   = 4                     ; Uniform X/Y head size. Range 0..100; 0 creates a point; absent/invalid uses size_x/size_y. Z length is controlled only by size_z to keep the tracer continuous.
mesh_tracer_tail_size   = 4                     ; Uniform X/Y tail size. Range 0..100; 0 closes the tail; absent/invalid uses size_x/size_y. Z length is controlled only by size_z.
mesh_tracer_glow_rate   = 0                     ; Glow intensity, range 0..10. Changes brightness only.
mesh_tracer_noise_rate  = 0                     ; Stable random trail distortion/noise, range 0..10. 0 = disabled.
mesh_tracer_pulse_rate  = 0                     ; Width-pulsation intensity, range 0..10. 0 = disabled.
mesh_tracer_pulse_speed = 0                     ; Pulsation speed in cycles per second, range 0..10. 0 = disabled; requires mesh_tracer_pulse_rate > 0.

visual_tint = 40_120_255_255        ; RGBA tint applied to the main VP/BASE/3DS visual.
wireframe_tint  = 255_95_70_255     ; RGB/RGBA tint applied to supported weapon and vehicle wireframe interfaces.

visual_spin_x = 0                   ; X spin intensity of the main VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.
visual_spin_y = 0                   ; Y spin intensity of the main VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.
visual_spin_z = 10                  ; Z spin intensity of the main VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.

visual_scale_x = 1.0                ; X-axis scale of the active main VP/BASE/3DS visual. Default: 1.0.
visual_scale_y = 1.0                ; Y-axis scale of the active main VP/BASE/3DS visual. Default: 1.0.
visual_scale_z = 3.0                ; Z-axis scale of the active main VP/BASE/3DS visual. Default: 1.0.

visual_rotation_x = 0               ; Fixed X-axis visual rotation in degrees. 0 or absent = no rotation.
visual_rotation_y = 0               ; Fixed Y-axis visual rotation in degrees. 0 or absent = no rotation.
visual_rotation_z = 0               ; Fixed Z-axis visual rotation in degrees. 0 or absent = no rotation.

; VP trail controls affect only embedded VP trails, particles and children; they
; do not tint or transform an external 3DS model. This separation is useful when
; the projectile body and its legacy particle system need different treatment.

vp_trail_scale_x = 1.0              ; X scale of VP trails, particles and embedded children only.
vp_trail_scale_y = 1.0              ; Y scale of VP trails, particles and embedded children only.
vp_trail_scale_z = 1.0              ; Z scale of VP trails, particles and embedded children only.
vp_trail_spin_x = 0                 ; X spin intensity of VP trails, particles and embedded children only: 0-10.
vp_trail_spin_y = 0                 ; Y spin intensity of VP trails, particles and embedded children only: 0-10.
vp_trail_spin_z = 10                ; Z spin intensity of VP trails, particles and embedded children only: 0-10.
vp_trail_tint = 255_255_255_255     ; RGBA tint applied only to VP trails, particles and embedded children; does not modify a 3DS model.

; Weapon decorations use the same reusable periodic/persistent visual subsystem
; documented above. Their offsets are relative to the parent Weapon.

decoration_fx_mode = periodic                             ; Periodic decoration mode.
decoration_fx_vp = 99                                     ; Legacy VP decoration visual; final fallback.
decoration_fx_base = BASE/FX/DECORATION.BASE              ; Data-relative BASE family; falls back to decoration_fx_vp.
decoration_fx_3ds = 3DS/FX/decoration.3ds                 ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_x = 1.0                               ; X scale of active decoration.
decoration_fx_scale_y = 1.0                               ; Y scale of active decoration.
decoration_fx_scale_z = 1.0                               ; Z scale of active decoration.
decoration_fx_spin_x = 0                                  ; X spin intensity: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_y = 0                                  ; Y spin intensity: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_z = 0                                  ; Z spin intensity: 0-10, decimals allowed; 0 = no spin.
decoration_fx_tint = 255_95_70_200                        ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_in = 500                               ; Main decoration fade-in in milliseconds. 0 or absent = immediate.
decoration_fx_fade_out = 500                              ; Main decoration fade-out in milliseconds. 0 or absent = immediate.
decoration_fx_vp_trail_tint = 255_255_255_255             ; RGBA tint of VP decoration particles/trails. Alpha 0 = invisible.
decoration_fx_vp_trail_scale_x = 1.0                      ; X scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_y = 1.0                      ; Y scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_z = 1.0                      ; Duration/apparent-length multiplier for VP decoration particles/trails.
decoration_fx_vp_trail_fade_in = 500                      ; Fade-in time for VP trails/particles. 0 or absent = immediate.
decoration_fx_vp_trail_fade_out = 500                     ; Fade-out time for VP trails/particles. 0 or absent = immediate.
decoration_fx_duration = 1000                 ; Total periodic-decoration duration in milliseconds.
decoration_fx_interval = 500_1500             ; Random interval in milliseconds between spawns. A single value gives a fixed interval.
decoration_fx_count = 2_7                     ; Random decoration count per spawn. A single value gives a fixed count.
decoration_fx_random_pos = 90                 ; XYZ position randomization around the parent Vehicle/Weapon.
decoration_fx_offset_x = 0                    ; X offset from the parent Vehicle/Weapon center.
decoration_fx_offset_y = 0                    ; Y offset from the parent Vehicle/Weapon center.
decoration_fx_offset_z = -40                  ; Z offset from the parent Vehicle/Weapon center.

decoration_fx_mode = persistent                           ; Persistent decoration remains active while the parent Vehicle/Weapon remains active.
decoration_fx_vp = 99                                     ; Legacy VP decoration visual; final fallback.
decoration_fx_base = BASE/FX/DECORATION.BASE              ; Data-relative BASE family; falls back to decoration_fx_vp.
decoration_fx_3ds = 3DS/FX/decoration.3ds                 ; 3DS decoration model; takes priority over BASE and VP.

decoration_fx_scale_x = 1.0                               ; X scale of the active decoration.
decoration_fx_scale_y = 1.0                               ; Y scale of the active decoration.
decoration_fx_scale_z = 1.0                               ; Z scale of the active decoration.
decoration_fx_spin_x = 0                                  ; X spin intensity: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_y = 0                                  ; Y spin intensity: 0-10, decimals allowed; 0 = no spin.
decoration_fx_spin_z = 0                                  ; Z spin intensity: 0-10, decimals allowed; 0 = no spin.
decoration_fx_tint = 255_95_70_200                        ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_in = 500                               ; Main decoration fade-in in milliseconds. 0 or absent = immediate.
decoration_fx_fade_out = 500                              ; Main decoration fade-out in milliseconds. 0 or absent = immediate.
decoration_fx_vp_trail_tint = 255_255_255_255             ; RGBA tint of VP decoration particles/trails. Alpha 0 = invisible.
decoration_fx_vp_trail_scale_x = 1.0                      ; X scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_y = 1.0                      ; Y scale of VP decoration particles/trails.
decoration_fx_vp_trail_scale_z = 1.0                      ; Duration/apparent-length multiplier for VP decoration particles/trails.
decoration_fx_vp_trail_fade_in = 500                      ; Time in milliseconds for VP trails/particles to reach configured opacity. 0 or absent = immediate.
decoration_fx_vp_trail_fade_out = 500                     ; Time in milliseconds for VP trails/particles to fade out when the decoration ends. 0 or absent = immediate.
decoration_fx_offset_x = 0                    ; X offset from the parent Vehicle/Weapon center.
decoration_fx_offset_y = 0                    ; Y offset from the parent Vehicle/Weapon center.
decoration_fx_offset_z = -40                  ; Z offset from the parent Vehicle/Weapon center.

; Chain Weapon propagation continues a hit from one enemy unit to another
; nearby target. Damage, search radius and delay are independently configurable.

chain_allow = 1               ; Enables Chain Weapon propagation after a projectile hits a unit.
chain_max_jumps = 4           ; Maximum number of additional jumps/bounces after the first impact.
chain_radius = 1400           ; Search radius for the next enemy target after each impact.
chain_damage_mult = 0.75      ; Damage retained at each jump. 1.0 = no loss; 0.75 = each jump deals 75% of the previous jump's damage.
chain_jump_delay = 120        ; Delay in milliseconds between an impact and the next chain jump. 0 = immediate propagation.

; Player-only launch shake is separate from world-space SHK effects. It can be
; used to give the player stronger weapon feedback without shaking nearby AI or
; other observers.

shk_launch_player_slot = 4                   ; Shake slot generated when this Weapon launches, for the player only.
shk_launch_player_time = 500                 ; Player-only launch-shake duration in milliseconds.
shk_launch_player_mag0 = 1.5                 ; Initial player-only launch-shake intensity.
shk_launch_player_mag1 = 0.5                 ; Final player-only launch-shake intensity.

; Debuff is a reusable status-effect system. A single Weapon can combine damage
; over time, stat modifiers, stun, mind control, visual overlays, sounds, PAL
; and SHK feedback. Host Stations are protected from mind-control and stun even
; when general Host Station debuff application is explicitly enabled.

debuff_allow               = 1                 ; Enables this Weapon's debuff. 1 = enabled, 0 = disabled.
debuff_allow_on_host_station = 0               ; Allows the debuff to affect Host Stations. Mind control and stun are still ignored on Host Stations.
debuff_inherit_to_children = 0                 ; Propagates an active debuff to child units generated directly by the affected unit. 0 or absent = disabled.
debuff_icon = Interface/StatusIcons/electrified.png      ; Data-relative icon shown while the unit is debuffed. Empty/invalid = no icon.
debuff_name = electrified                      ; Internal name of the debuff applied by this Weapon.
debuff_mindcontrol = 1                         ; Converts the affected unit to the source faction. Does not apply to Host Stations.
debuff_stun = 1                                ; Enables unit stun during the debuff. Does not apply to Host Stations.
debuff_stun_motion_level = 50%                 ; Strength of altered movement during stun: 0% = disabled, 100% = maximum.
debuff_stun_unit_fire = 1                      ; 1 = AI and player fire continuously while stunned; 0 = they cannot fire while stunned.
debuff_damage = 2%                             ; Damage applied at each tick. With %, uses target maximum HP; without %, uses fixed damage.
debuff_tick_time = 2000                        ; Time in milliseconds between damage ticks.
debuff_duration = 12000                        ; Total debuff duration in milliseconds.
debuff_force_malus = -50%                      ; Force modifier during debuff. Example: -50% reduces force by 50%.
debuff_maxrot_malus = -50%                     ; maxrot modifier during debuff.
debuff_shield_malus = -50%                     ; Shield modifier during debuff.
debuff_mgun_shot_time_malus = -40%             ; Modifier to the affected unit's MGUN fire rate.
debuff_shot_time_malus = -40%                  ; Modifier to the affected unit's primary Weapon fire rate.
debuff_snd_pitch = -50%                        ; Pitch modifier for sounds emitted by the affected unit. Negative lowers pitch, positive raises it. 0 or absent = unchanged.
debuff_vp = 123_123_123_123_123_123_123_123    ; VP visuals generated by the debuff. Multiple VP IDs may be separated with _. If debuff_3ds is configured, the 3DS visual is generated alongside the VPs.
debuff_3ds = 3DS/electrified.3ds               ; Optional external 3DS visual generated alongside the debuff VPs, relative to Data. If missing/unloadable, configured VP visuals remain active.
debuff_tint = 0_255_0_255                      ; RGBA tint applied to debuff VP and 3DS visuals.
debuff_scale = 1.0                             ; Uniform scale applied to debuff VP and 3DS visuals.
debuff_random_max_offset = 25%                 ; Maximum random visual offset from unit center. With %, uses unit size; without %, uses a fixed distance.
debuff_vp_trail_tint = 0_255_0_255             ; RGBA tint applied only to VP trails, particles and child effects belonging to the debuff.
debuff_target_tint = 140_255_140_150           ; RGBA tint applied to the affected unit model; compatible with VP and 3DS mesh visuals.
snd_debuff_sample       = sounds/zap.wav       ; Debuff sound. Without debuff_tick_time, remains looped for the entire debuff duration.
snd_debuff_pitch        = 0                    ; Pitch of snd_debuff_sample.
snd_debuff_volume       = 180                  ; Volume of snd_debuff_sample.
snd_debuff_radius       = 3000                 ; Maximum debuff-sound radius. Volume decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
pal_debuff_slot         = 4                    ; Palette-effect slot used by the debuff.
pal_debuff_mag0         = 5                    ; Initial debuff palette intensity.
pal_debuff_mag1         = 0                    ; Final debuff palette intensity.
pal_debuff_time         = 1500                 ; Debuff palette-effect duration in milliseconds.
pal_debuff_radius       = 3000                 ; Maximum debuff palette-effect radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
shk_debuff_slot         = 1                    ; Shake slot used by the debuff.
shk_debuff_mag0         = 2                    ; Initial debuff-shake intensity.
shk_debuff_mag1         = 0                    ; Final debuff-shake intensity.
shk_debuff_time         = 1500                 ; Debuff-shake duration in milliseconds.
shk_debuff_radius       = 3000                 ; Maximum debuff-shake radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.

; Cluster Weapons split into child Weapons either after a timer or on impact.
; Child count, direction, spread and recursive generations are all data-driven.
; Keep recursive generation/count values reasonable: combinations multiply very
; quickly and can create large numbers of active projectiles.

cluster_enable          = 1                     ; Enables Cluster behavior. 1 = enabled, 0 = disabled.
cluster_count           = 2_8                   ; Number of child Weapons generated per split. Single value = fixed count; min_max = inclusive random count. Safe range 1-64; invalid values disable clustering.
cluster_weapon_id       = 3                     ; Weapon ID generated as the cluster child.
cluster_trigger_time    = 1000                  ; > 0 = timed cluster trigger in milliseconds. 0 or absent = cluster splits on impact.
cluster_horizontal_angle = 0_360                ; Horizontal cluster direction. Single value = fixed angle; min_max = range. 0_360 distributes clusters uniformly.
cluster_vertical_angle = -45_45                 ; Vertical cluster direction. Single value = fixed angle; min_max = random angle in range.
cluster_spread_x        = 60                    ; Random X deviation applied after the base angle direction; may be combined with angle parameters.
cluster_spread_y        = 60                    ; Random Y deviation applied after the base angle direction; may be combined with angle parameters.
cluster_vp = 112                                ; Legacy VP generated when the Weapon splits; final fallback.
cluster_base = BASE/FX/CLUSTER_SPLIT.BASE       ; BASE family generated on split, relative to Data; falls back to cluster_vp.
cluster_3ds = 3DS/FX/cluster_split.3ds          ; 3DS split model; takes priority over BASE and VP.
cluster_generations      = 3                    ; Allows generated cluster Weapons to trigger their own clustering for the configured number of generations.
pal_cluster_slot         = 4                    ; Palette slot used at split. 0/absent = disabled.
pal_cluster_mag0         = 5                    ; Initial split palette intensity. Default: 1.
pal_cluster_mag1         = 0                    ; Final split palette intensity. Default: 0.
pal_cluster_time         = 1500                 ; Split palette duration in milliseconds. Default: 1000.
pal_cluster_radius       = 4000                 ; Maximum cluster palette-effect radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
shk_cluster_slot         = 1                    ; Shake slot used at split. 0/absent = disabled.
shk_cluster_mag0         = 2                    ; Initial split-shake intensity. Default: 1.
shk_cluster_mag1         = 0                    ; Final split-shake intensity. Default: 0.
shk_cluster_time         = 5000                 ; Split-shake duration in milliseconds. Default: 1000.
shk_cluster_radius       = 4000                 ; Maximum cluster-shake radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
snd_cluster_sample      = sounds/Smex02.wav     ; Sound played when clustering activates.
snd_cluster_pitch       = 0                     ; Split sound pitch.
snd_cluster_volume      = 120                   ; Split sound volume.
snd_cluster_radius   = 4000                     ; Maximum cluster-sound radius. Volume decreases linearly to 0 at the limit. 0 or absent = legacy behavior.

--------------------Palette:

; Palette slots are reusable color-effect channels. Original slots retain their
; vanilla behavior; OpenNeoUA additionally allows custom RGB slots to be defined
; in Nucleus.ini and referenced by vehicle/Weapon PAL events.

; Classic slots:

gfx.color_eff_pwr[1]  = 100 ; Red
gfx.color_eff_pwr[2]  = 100 ; Blue
gfx.color_eff_pwr[3]  = 100 ; Green
gfx.color_eff_pwr[4]  = 100 ; Inverse
gfx.color_eff_pwr[5]  = 100 ; Inverse Dark
gfx.color_eff_pwr[6]  = 100 ; Black & White
gfx.color_eff_pwr[7]  = 100 ; Inverse Turquoise

; Custom slots:

gfx.color_eff[Numero_Nuovo_Slot]  = R_G_B ; Defines a custom palette slot (slots 8..16). Multiple custom slots may be declared in Nucleus.ini and referenced by vehicle/Weapon PAL parameters. R_G_B components use 0-255. Example: gfx.color_eff[9] = 255_102_7 ; Orange. Existing vanilla slots remain unchanged.

--------------------General Event Conventions:

; Many sound pitch parameters accept min_max, allowing one event to choose a
; different pitch each time and reducing repetition without duplicating assets.

snd_...._pitch  = -4000_500   ; Example pitch range supported by pitch parameters; useful for randomized sound variation.

; Radius parameters localize sound, palette and shake events in world space.
; Setting 0 or omitting the radius preserves the documented legacy behavior.

snd_***_radius = 4000         ; Maximum radius for snd events. Volume decreases linearly from the source to 0 at the limit. 0 or absent = legacy behavior.
pal_***_radius = 4000         ; Maximum radius for pal events. Intensity decreases linearly from the source to 0 at the limit. 0 or absent = legacy behavior.
shk_***_radius = 4000         ; Maximum radius for shk events. Intensity decreases linearly from the source to 0 at the limit. 0 or absent = legacy behavior based on the corresponding shk_***_mute behavior.

