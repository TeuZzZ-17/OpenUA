; =============================================================================
; OpenNeoUA Parameter Guide
; Public configuration and scripting reference for modders
; =============================================================================
;
; OpenNeoUA is an independent, open-source evolution of the Urban Assault
; UA_source/OpenUA engine. Its goal is to extend real engine capabilities while
; preserving compatibility with vanilla data, levels, scripts, saves and the
; original game feel wherever possible.
;
; This file is a REFERENCE AND EXAMPLE CATALOG, not a configuration that should
; be copied wholesale into a game installation. Add only the parameters needed
; by your mod or project. Example values demonstrate syntax and typical usage;
; they are not necessarily recommended balance values.
;
; IMPORTANT COMPATIBILITY NOTES
; - When an OpenNeoUA parameter is omitted, the engine uses the documented
;   fallback or legacy behavior for that feature.
; - Many extensions are intentionally opt-in. Read the comment for each
;   parameter before enabling it.
; - Percent values such as 5% are interpreted as percentages where explicitly
;   documented. The same parameter may sometimes also accept a fixed numeric
;   value without the % symbol.
; - Many parameters support min_max syntax, for example 300_600. In those
;   cases OpenNeoUA selects a random value between the specified minimum and
;   maximum. A single value keeps the result fixed.
; - Unless stated otherwise, time values are in milliseconds.
; - "World units" refers to the coordinate/distance scale used by the engine.
; - Paths documented as Data-relative are resolved from the game's Data folder.
;
; VISUAL MODEL FALLBACKS
; OpenNeoUA can extend legacy VP visuals with external BASE and 3DS assets.
; Where all three forms are supported, the usual priority is:
;
;     3DS -> BASE -> VP
;
; A 3ds_* asset therefore overrides the matching base_* and vp_* visual when it
; loads successfully. A base_* asset falls back to the corresponding VP.
; BASE parameters point to a .BASE file as the visual family's single entry
; point. The native loader resolves supported BASE/KIDS/SKLT relationships,
; ILBM/texture resources, ANM/VANM animation data and supported embedded assets.
; .BASE dependencies are resolved from the file's folder and its subfolders as
; supported by the loader.
;
; The exact runtime behavior is authoritative. This guide documents the public
; parameters and their intended use, but modders should test combinations that
; substantially change vanilla systems.
;
; =============================================================================

; Many features support value = min_max and choose a random value between the
; specified minimum and maximum.
; The 3ds_* and base_* parameters extend the legacy vp_* model definitions and
; take priority over them. Paths are relative to the Data folder. In particular,
; .BASE files resolve their supported dependencies from the folder in which the
; file is placed and its subfolders.
; base_* parameters point to a .BASE file, the single entry point for that
; visual family. The native loader resolves supported BASE, KIDS, SKLT,
; ILBM/texture, ANM/VANM and embedded resources.

--------------------General / Debug Controls:

F5  ; New debug mode: slows game time to 20% (80% slowdown); toggles on/off.
F6  ; New debug mode: freezes game time; useful for screenshots and video capture.
F7  ; New debug mode: makes the currently selected unit invulnerable.
F8  ; New debug mode: instantly destroys the currently selected vehicle.
F9  ; New debug mode: makes all units invulnerable.
F10 ; New debug mode: displays legacy collisions and the main compound spheres used by units/weapons. Invisible bridges and numeric labels are not shown.
F11 ; New debug mode: hides the in-game HUD; useful for screenshots and video capture.
F12 ; New debug mode: fills the three Host Station bars (genesis, energy and move) and makes all Host-issued in-game actions free.

--------------------Nucleus.ini:

game.new.debug  = yes                                 ; Enables the new debug controls (F5, F6, F7, F8, F9, F10, F11 and F12).
game.briefing_model_render = no                       ; Selects unit presentation in briefings: no = text, yes = render the available VP/BASE/3DS visual. Recommended default: no.
game.robo_player_ai_behavior = yes                    ; Enables manual movement behavior for the player's Host Station instead of teleport-style movement. Also enables the optional flux and twist parameters for the player's Host Station.
game.robo_building_collision_damage = 5%              ; Host Station damage applied for each building it destroys by collision. With %, uses a percentage of maximum HP; without %, uses fixed damage. Damage is reduced by shield. 0 or absent = no damage.
game.robo_mobile_move_energy_cost_multiplier = 1.0    ; Multiplier for the mobile Host Station movement battery cost. Absent/invalid = 1.0.
game.robo_mobile_main_energy_cost_multiplier = 0.33   ; Multiplier for the mobile Host Station main-energy battery cost. Absent/invalid = 0.33.
game.robo_mobile_build_energy_cost_multiplier = 0.33  ; Multiplier for the mobile Host Station build/life battery cost. Absent/invalid = 0.33.
game.spectator_mode = yes                          ; Enables spectator mode, starting without a faction and in free camera. The spectator vehicle is read from Data/Scripts/spectator_vehicle.txt and should define a hidden, invulnerable UFO.
game.weapon_weapon_collision = yes                 ; Enables collisions between hostile or neutral weapons/projectiles. Projectiles owned by the same faction do not collide with one another.
game.recoil_kick_time = 0                          ; Global time in milliseconds for recoil to reach maximum displacement; shared by recoil and mgun_recoil. 0 = immediate kick. Range: 0-5000.
game.recoil_hold_time = 0                          ; Global time in milliseconds to remain at maximum recoil before returning. Shared by recoil and mgun_recoil. 0 = no hold. Range: 0-5000.
game.recoil_return_time = 420                      ; Global time in milliseconds for recoil to return to neutral. Shared by recoil and mgun_recoil. Runtime default: 420. Range: 0-5000.
game.black_sect_units_tint = 140_140_140_125       ; Black Sect unit tint in R_G_B_A format. Each component ranges from 0 to 255.
game.powerstation_energy_multiplier = 2.0          ; Multiplies energy recharge and drain at Power Stations, Host Stations and mobile power sources. 1.0 = vanilla behavior.
game.sprint_energy_cost = 1%                       ; Continuous Sprint energy cost per second. With %, uses maximum energy; without %, uses a fixed cost. 0 or absent = no cost.
game.sprint_energy_drain_interval_ms = 1000        ; Interval in milliseconds between continuous Sprint drain applications. 0 = continuous/accumulated application.
game.fixed_tick_tank_ground_pose_mult = 5.5        ; Adjusts tank response to slopes using the always-active fixed timing path. Range: 2.0-30.0. Suggested value: 5.5.
game.fall_damage = 2%                              ; Real fall/crash damage. With %, uses maximum HP; without %, uses fixed damage. Damage is reduced by shield. Absent = vanilla behavior.
game.push_at_death_mult = 2.0                      ; Multiplies push and aoe_unit_push only when the hit kills the target. Range: 0..10; final effective intensity remains capped at 10. Absent or 1.0 = no extra push. Does not increase damage.
game.handbrake_power = 1.0                         ; Handbrake strength multiplier. Affects braking behavior and reduces recoil/spread while the handbrake system is engaged. Runtime default: 1.0.
game.handbrake_sound = sounds/new/handbrake.wav    ; Sound played when the handbrake is activated.
game.player_tank_brake_time = 1500                 ; Time in milliseconds for a player tank to come to a natural stop after releasing acceleration. <= 0 or absent = vanilla behavior.
game.gem_unlock_new_ui = yes                       ; Replaces the graphical GEM-upgrade popups with OpenNeoUA's compact text-based interface. Default: no.
game.gem_unlock_duration = 2000                    ; GEM pop-in duration in milliseconds. Runtime default: 8000. 0 = hide the pop-in. Does not slow game time. Applies to both the new and legacy interfaces.
game.gem_unlock_sound = sounds/new/gem.wav         ; Optional sound played when a GEM upgrade is unlocked. Applies to both the new and legacy interfaces.
game.world_ui_max_distance = 5700                  ; Shared distance limit for multi-selection and fade-in/fade-out of legacy and new world-space unit interfaces. Range: 100-20000. Default: 5700.
game.ai_target_range = 2160                        ; Maximum automatic target-acquisition distance for AI. 0 = vanilla behavior. Positive values are also applied to the player-side acquisition path. Maximum: 2160.
game.mgun_range = 1500                             ; Global hitscan range for MGUN machine guns, including AI MGUNs and gun_type = mg. Vanilla default: 1000. Maximum: 6000.
game.mgun_ai_fire_alignment = 0.80                 ; Global forward-alignment requirement for AI MGUN fire. Lower values are more permissive. Default: 0.85.
game.sprint_force_up = 60%                         ; Maximum force increase during Sprint. With %, increases the unit's original force proportionally; without %, adds a fixed amount.
game.sprint_pitch_up = 20%                         ; Maximum engine-pitch increase during Sprint. This value must be written as a percentage.
game.sprint_ramp_time = 3000                       ; Ramp-up and ramp-down duration of Sprint in milliseconds.
game.ai_max_altitude_above_ground = 1800           ; Maximum altitude above ground for AI-controlled airborne units. 0, absent or invalid = vanilla behavior.
game.player_max_altitude_above_ground = 1600       ; Maximum altitude above ground for player-controlled airborne units. 1600.0 = vanilla behavior.
game.unit_enemy_collision_damage = 5%              ; Collision damage between enemy units. With %, uses maximum HP; without %, uses fixed damage. Damage is reduced by shield. 0 or absent = no damage.
game.unit_friendly_collision_damage = 1%           ; Collision damage between allied units. With %, uses maximum HP; without %, uses fixed damage. Damage is reduced by shield. 0 or absent = no damage.
game.crash_diagnostics = yes                       ; Enables game crash diagnostics for debugging and development. Disabled by default to avoid heavy logging.
game.unit_kill_stat_bonus = 5%                     ; Per-kill-medal unit bonus applied to force, maxrot, shield, damage and rate of fire. Must be specified as a percentage.
game.robo_death_time_scale = 0.3                   ; Example time-scale value used when a Host Station is destroyed. Runtime default: 1.0. Suggested range: 0.05-1.0; 1.0 disables the slow-motion effect.
game.robo_death_time_scale_duration = 2000         ; Duration in milliseconds of the Host Station destruction slow-motion effect. 0 or absent = disabled.
game.robo_death_time_scale_max_distance = 0        ; Maximum XZ distance from the player at which a Host Station death can trigger slow motion. 0 = unlimited distance.
game.play_as_other_factions = yes                  ; Also exposed in the game options. Allows other factions to be selected and played from the briefing screen.
game.plasma_currency_enable = 1                    ; Enables the global Plasma reserve in single-player. Absent/no/0 = disabled and vanilla behavior.
game.plasma_currency_gain = 0.1%                   ; Plasma added to the global reserve when collected. With %, grants a fraction of the collected Plasma; without %, adds a fixed amount.
game.plasma_death_duration_mult = 10               ; Multiplies how long Plasma dropped by dead units remains in single-player. 1.0/absent/0/negative/invalid = vanilla duration. Netgame always uses vanilla behavior.
game.plasma_death_magnet_radius = 600              ; 3D radius within which dropped Plasma begins moving toward the player-controlled unit. Single-player only; does not affect AI units. 0/absent/invalid = disabled.
game.plasma_death_magnet_speed = 300               ; Speed at which dropped Plasma moves toward the player. Does not apply to AI units. 0/absent/invalid = disabled; also requires a positive magnet radius.
game.plasma_snd_pickup_sample = sounds/pickup.wav  ; Sound played by the unit that collects Plasma, including the player.
game.plasma_snd_pickup_volume = 90                 ; Plasma pickup sound volume.
game.plasma_snd_pickup_pitch  = 0                  ; Plasma pickup sound pitch.
game.global_shk_fade_in = 50                       ; Global fade-in in milliseconds for all SHK shake effects.
game.global_shk_fade_out = 500                     ; Global fade-out in milliseconds for finite-duration SHK effects.
game.global_pal_fade_in = 50                       ; Global fade-in in milliseconds for all PAL palette effects.
game.global_pal_fade_out = 500                     ; Global fade-out in milliseconds for finite-duration PAL effects.
game.ambient_sound = sounds/ambient/wind.wav       ; Configurable global level ambience. If the path identifies a folder rather than a specific file, OpenNeoUA can select a sound from that folder for the level and loop it.
game.ambient_sound_volume = 50                     ; Global ambient volume. Runtime default: 100. Slider range: 0-127; 0 = muted.

gfx.particles.limit = 20000                       ; Maximum number of active in-game particles. Vanilla-safe default: 5000.
gfx.blending = 1                                  ; Graphics blending mode: 0 = default, 1 = additive, 2 = sharp.
gfx.vsync = 2                                     ; Vertical synchronization: 0 = disabled, 1 = enabled, 2 = adaptive with fallback to mode 1.
gfx.color_effects = 1                             ; Enables the framebuffer used by post-processing color effects. 0 disables post-processing effects.
gfx.maxfps = 60                                   ; FPS limit. Safe default: 60. The FPS/Hz menu can expose values up to 240.
gfx.ground_decal_limit = 256                      ; Maximum number of active ground decals. 0 disables decals; negative/invalid = 256; values above 1024 are clamped to 1024.
gfx.visual_filter = Black_Wadi.pal                ; Palette filter selectable from the in-game options. If the file cannot be loaded, the filter is disabled.
gfx.visual_filter_strength = 0.25                 ; Palette-filter strength. 0 = no visual modification.
gfx.render_sectors = 50                           ; Render-sector range: 3-99. Even values are normalized to the next lower odd value; for example, 50 becomes 49 so the grid remains centered.
gfx.sky_height = -600                             ; Vertical skybox offset relative to the camera/player. More negative values move the sky lower.
gfx.sky_render = yes                              ; Enables or disables sky rendering. yes = enabled, no = disabled.
gfx.horizon_fog_enable = yes                      ; Enables transparent horizon fog independently from horizon darkening.
gfx.horizon_fog_start = 4000                      ; Distance at which transparent horizon fog begins. Higher values move the effect farther away.
gfx.horizon_fog_length = 2000                     ; Length of the horizon-fog transition. Higher values produce a softer fade.
gfx.horizon_fog_strength = 0.80                   ; Transparent horizon-fog strength. 0.0 disables it; 1.0 is maximum strength.
gfx.horizon_fog_color = 150_155_160               ; Transparent horizon-fog color in R_G_B format. 150_155_160 is a light gray.
gfx.horizon_dark_enable = yes                     ; Enables horizon darkening independently from transparent fog.
gfx.horizon_dark_start = 2000                     ; Distance at which horizon darkening begins. Higher values move the darkening farther away.
gfx.horizon_dark_length = 2000                    ; Length of the horizon-darkening transition. Higher values make the darkening enter more gradually.
gfx.horizon_dark_strength = 0.65                  ; Horizon-darkening strength. 0.0 disables it; 1.0 is maximum darkening.
gfx.horizon_dark_color = 0_0_0                    ; Horizon-darkening color in R_G_B format. 0_0_0 is pure black.
gfx.vhs_filter_shader = res/ua_cinematic_1998_vhs.ps         ; Shader path for the VHS filter. Missing/unloadable = filter disabled.
gfx.vhs_filter_shader_vbo = res/ua_cinematic_1998_vhs_vbo.ps ; VBO shader path for the VHS filter. Missing/unloadable = filter disabled.
gfx.vhs_filter_strength = 0.60                    ; VHS-filter strength. 0 = disabled.
gfx.atmosphere_fx = yes                           ; Enables the world Atmosphere pass. no = vanilla rendering; missing shader = vanilla fallback.
gfx.atmosphere_strength = 0.50                    ; Global atmosphere strength. 0 = visually disabled.
gfx.atmosphere_exposure = 1.70                    ; Controls atmospheric exposure/glow intensity.
gfx.atmosphere_contrast = 0.95                    ; Controls atmospheric contrast intensity.

gfx.atmosphere_saturation = 0.80                  ; Controls atmospheric color saturation.
gfx.atmosphere_vignette = 0.60                    ; Controls the strength of the dark-edge vignette effect.
gfx.hide_map_border_walls = yes                   ; Allows the blue map-border walls to be hidden.
gfx.world_new_hp_bar_enable = no                  ; yes enables the configurable mesh-based world HP bar.
gfx.world_new_hp_bar_full_tint = 0_217_81_255     ; RGBA tint and opacity of the full-health portion of the bar.
gfx.world_new_hp_bar_low_tint = 255_0_0_255       ; RGBA tint toward which the HP bar gradually shifts as the vehicle takes damage.
gfx.world_new_hp_bar_empty_tint = 255_0_0_0       ; RGBA tint and opacity of the empty portion of the HP bar.

; Regen and Drain feedback can use external VP/BASE/3DS visuals. When no custom
; visual is available, OpenNeoUA can fall back to the procedural + / - symbols.
; These effects are presentation-only; the gameplay behavior is defined by the
; corresponding Regen/Drain system on the unit.

gfx.regen_fx_vp = 0                               ; Legacy VP for the Regen effect; final fallback before the procedural + symbol.
gfx.regen_fx_base = BASE/FX/REGEN.BASE            ; BASE family for the Regen effect, relative to Data; automatically falls back to gfx.regen_fx_vp.
gfx.regen_fx_3ds = 3DS/FX/regen.3ds               ; 3DS model for the Regen effect, relative to Data; takes priority over BASE and VP.
gfx.regen_fx_scale = 1.0                          ; Uniform X/Y/Z scale of the Regen VP/BASE/3DS visual. <= 0 or invalid = 1.0.
gfx.regen_fx_spin_x = 0                           ; X-axis spin intensity for the Regen VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.
gfx.regen_fx_spin_y = 0                           ; Y-axis spin intensity for the Regen VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.
gfx.regen_fx_spin_z = 0                           ; Z-axis spin intensity for the Regen VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.
gfx.regen_fx_tint = 80_255_120_230                ; RGBA tint of the Regen effect, applied to VP/BASE/3DS or to the procedural + symbol.
gfx.regen_fx_duration = 1000                      ; Lifetime in milliseconds of each Regen visual effect.
gfx.regen_fx_interval = 300_600                   ; Random interval range in milliseconds between Regen-effect spawns. A single value gives a fixed interval.
gfx.regen_fx_count = 2_4                          ; Random number of Regen effects created per trigger. A single value gives a fixed count. Runtime maximum: 32.
gfx.regen_fx_random_max_offset = 80%              ; Maximum random offset from the unit center. With %, uses the unit size; without %, uses a fixed world-space distance.
gfx.regen_mesh_size = 30                          ; Size of the procedural mesh-generated + symbols.
gfx.regen_mesh_thickness = 5                      ; Bar thickness of the procedural + symbols.
gfx.regen_mesh_rise_speed = 100                   ; Upward movement speed of the procedural + symbols.
gfx.regen_mesh_fade_in = 150                      ; Fade-in duration in milliseconds for procedural + symbols. 0 = immediate appearance.
gfx.regen_mesh_fade_out = 300                     ; Fade-out duration in milliseconds for procedural + symbols. 0 = immediate disappearance.

gfx.drain_fx_vp = 0                               ; Legacy VP for the Drain effect; final fallback before the procedural - symbol.
gfx.drain_fx_base = BASE/FX/DRAIN.BASE            ; BASE family for the Drain effect, relative to Data; automatically falls back to gfx.drain_fx_vp.
gfx.drain_fx_3ds = 3DS/FX/drain.3ds               ; 3DS model for the Drain effect, relative to Data; takes priority over BASE and VP.
gfx.drain_fx_scale = 1.0                          ; Uniform X/Y/Z scale of the Drain VP/BASE/3DS visual. <= 0 or invalid = 1.0.
gfx.drain_fx_spin_x = 0                           ; X-axis spin intensity for the Drain VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.
gfx.drain_fx_spin_y = 0                           ; Y-axis spin intensity for the Drain VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.
gfx.drain_fx_spin_z = 0                           ; Z-axis spin intensity for the Drain VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin.
gfx.drain_fx_tint = 255_80_80_230                 ; RGBA tint of the Drain effect, applied to VP/BASE/3DS or to the procedural - symbol.
gfx.drain_fx_duration = 1000                      ; Lifetime in milliseconds of each Drain visual effect.
gfx.drain_fx_interval = 300_600                   ; Random interval range in milliseconds between Drain-effect spawns. A single value gives a fixed interval.
gfx.drain_fx_count = 2_4                          ; Random number of Drain effects created per trigger. A single value gives a fixed count. Runtime maximum: 32.
gfx.drain_fx_random_max_offset = 80%              ; Maximum random offset from the unit center. With %, uses the unit size; without %, uses a fixed world-space distance.
gfx.drain_mesh_size = 30                          ; Size of the procedural mesh-generated - symbols.
gfx.drain_mesh_thickness = 5                      ; Bar thickness of the procedural - symbols.
gfx.drain_mesh_rise_speed = 100                   ; Upward movement speed of the procedural - symbols.
gfx.drain_mesh_fade_in = 150                      ; Fade-in duration in milliseconds for procedural - symbols. 0 = immediate appearance.
gfx.drain_mesh_fade_out = 300                     ; Fade-out duration in milliseconds for procedural - symbols. 0 = immediate disappearance.

